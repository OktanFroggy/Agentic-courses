<script type="text/template" id="tpl-async-1">
<h3>Теория</h3>

<p>Асинхронность — самая неправильно понимаемая тема в Python. Разберём с нуля, без магии.</p>

<p><b>Что такое асинхронность.</b> Это <b>не многопоточность и не многопроцессность</b>. Это <b>кооперативная многозадачность внутри одного потока</b>. Один поток исполнения, но он умеет переключаться между задачами, когда одна из них «ждёт» — сеть, диск, таймер.</p>

<p><b>Зачем это нужно.</b> Классическая программа на Python выполняется строка за строкой. Если ты делаешь HTTP-запрос — процессор простаивает 200 миллисекунд, ожидая ответа. Асинхронность позволяет в это время делать другие дела: отправить ещё 10 запросов, обработать уже пришедшие данные, распарсить предыдущий ответ.</p>

<p>В Agentic это критично. Агент делает десятки вызовов: LLM, поиск, база, инструменты. Синхронно — 30 секунд ожидания. Асинхронно — 3–4 секунды, потому что все вызовы идут параллельно.</p>

<h4>Event loop — сердце асинхронности</h4>

<p>Event loop (цикл событий) — это бесконечный цикл, который:</p>

<ol>
  <li>Берёт готовые к выполнению задачи</li>
  <li>Выполняет их до первого <code>await</code></li>
  <li>На <code>await</code> сохраняет состояние и возвращается к другим задачам</li>
  <li>Когда ожидаемая операция завершается — возобновляет задачу</li>
</ol>

<p>Аналогия: официант в ресторане. Он не стоит у столика, пока повар готовит блюдо. Он принимает заказ, идёт к следующему столику, потом возвращается, когда блюдо готово. Один официант — много столов. Это и есть async.</p>

<h4>async def, await, asyncio.run</h4>

<table>
  <thead><tr><th>Конструкция</th><th>Что делает</th></tr></thead>
  <tbody>
    <tr><td><code>async def</code></td><td>Объявляет корутину (асинхронную функцию)</td></tr>
    <tr><td><code>await</code></td><td>Отдаёт управление event loop, пока не готов результат</td></tr>
    <tr><td><code>asyncio.run()</code></td><td>Запускает event loop, точку входа</td></tr>
    <tr><td><code>asyncio.create_task()</code></td><td>Планирует корутину как фоновую задачу</td></tr>
    <tr><td><code>asyncio.gather()</code></td><td>Запускает несколько корутин параллельно</td></tr>
    <tr><td><code>asyncio.sleep()</code></td><td>Асинхронная задержка (не блокирует loop)</td></tr>
  </tbody>
</table>

<h4>Корутина vs вызов vs Task</h4>

<p>Это три разные вещи, и новички их путают:</p>

<pre><code>async def greet():
    return "hello"

# 1. Это корутина — объект, но НЕ выполняется
coro = greet()
print(coro)      # &lt;coroutine object greet at 0x...&gt;

# 2. Это выполнение через await — работает только внутри async def
async def main():
    result = await greet()
    print(result)       # hello

# 3. Это Task — корутина, запланированная в фоне
async def main2():
    task = asyncio.create_task(greet())    # уже запущена
    print(await task)                       # hello

asyncio.run(main())</code></pre>

<div class="warnbox"><b>Если корутину не запустить через await или asyncio.run — она не выполнится.</b> Ты получишь предупреждение «coroutine was never awaited» и ничего не произойдёт.</div>

<h4>Синхронный vs асинхронный код</h4>

<pre><code># СИНХРОННО: три запроса по 0.5с → 1.5с
import time
def fetch_sync(url):
    time.sleep(0.5)
    return f"data from {url}"

def main_sync():
    for url in ["a", "b", "c"]:
        print(fetch_sync(url))
# ~1.5 секунды

# АСИНХРОННО: три запроса по 0.5с → 0.5с
import asyncio
async def fetch_async(url):
    await asyncio.sleep(0.5)
    return f"data from {url}"

async def main_async():
    results = await asyncio.gather(
        fetch_async("a"),
        fetch_async("b"),
        fetch_async("c"),
    )
    print(results)
# ~0.5 секунды</code></pre>

<p>Работа та же, время в 3 раза меньше. На 100 запросах разница будет в 100 раз.</p>

<h4>Где какой подход использовать</h4>

<table>
  <thead><tr><th>Задача</th><th>Async</th><th>Sync</th></tr></thead>
  <tbody>
    <tr><td>Один вызов API</td><td>Не важно</td><td>Проще</td></tr>
    <tr><td>Много независимых вызовов</td><td>Обязательно</td><td>Медленно</td></tr>
    <tr><td>CLI-скрипт с 1 операцией</td><td>Оверкилл</td><td>Идеально</td></tr>
    <tr><td>Веб-сервер</td><td>Обязательно</td><td>Не масштабируется</td></tr>
    <tr><td>Агент с N шагами</td><td>Обязательно</td><td>Медленно</td></tr>
  </tbody>
</table>

<h3>Пошаговый разбор</h3>

<div class="step" data-step="1"><h4>Объявление</h4><p><code>async def name():</code> — создаёт корутину. Ничего не выполняется до await.</p></div>
<div class="step" data-step="2"><h4>Await</h4><p><code>result = await something()</code> — передаёт управление loop. Другие задачи продолжают работу.</p></div>
<div class="step" data-step="3"><h4>Точка входа</h4><p><code>asyncio.run(main())</code> запускает event loop и ждёт завершения main. Один раз на программу.</p></div>
<div class="step" data-step="4"><h4>Независимые задачи</h4><p><code>gather</code> или <code>create_task</code> — параллельный запуск. Ключевое слово: независимые.</p></div>
<div class="step" data-step="5"><h4>Никогда не блокируй loop</h4><p>Не используй <code>time.sleep</code>, синхронный <code>requests</code>, тяжёлые вычисления. Только async-аналоги.</p></div>

<pre><button class="copy-btn">copy</button><code>import asyncio
import time

# === БАЗОВЫЙ ASYNC ===
async def say_after(what: str, delay: float):
    await asyncio.sleep(delay)
    print(what)

async def main():
    t0 = time.perf_counter()

    # Последовательно — 1.0 секунда
    await say_after("первый", 0.5)
    await say_after("второй", 0.5)

    print(f"sequential: {time.perf_counter()-t0:.2f}s")

asyncio.run(main())

# === ПАРАЛЛЕЛЬНО ===
async def main_parallel():
    t0 = time.perf_counter()

    # Параллельно — 0.5 секунды
    await asyncio.gather(
        say_after("первый", 0.5),
        say_after("второй", 0.5),
    )

    print(f"parallel: {time.perf_counter()-t0:.2f}s")

asyncio.run(main_parallel())

# === CREATE_TASK ===
async def main_task():
    # Задача планируется немедленно
    task = asyncio.create_task(say_after("фон", 0.5))
    print("задача запущена в фоне")

    # Делаем что-то ещё
    await asyncio.sleep(0.1)
    print("пока задача работает, мы делаем своё")

    # Ждём результата
    await task
    print("задача завершена")

asyncio.run(main_task())</code></pre>

<h3>Где это работает в Agentic</h3>

<p><b>Параллельный вызов инструментов.</b> Модель часто просит вызвать несколько инструментов одновременно. Это самое частое применение gather:</p>

<pre><button class="copy-btn">copy</button><code>async def execute_tools_parallel(tool_calls: list, registry: dict):
    """Все инструменты выполняются параллельно."""
    async def run_one(call):
        fn = registry.get(call.function.name)
        if fn is None:
            return {"error": f"unknown: {call.function.name}"}
        args = json.loads(call.function.arguments)
        # fn может быть async или sync
        if asyncio.iscoroutinefunction(fn):
            return await fn(**args)
        return fn(**args)

    results = await asyncio.gather(*[run_one(c) for c in tool_calls])
    return results</code></pre>

<p><b>Параллельный RAG.</b> Поиск в нескольких источниках одновременно — 5× быстрее:</p>

<pre><button class="copy-btn">copy</button><code>async def search_all(query: str):
    results = await asyncio.gather(
        vector_search(query),
        bm25_search(query),
        web_search(query),
        return_exceptions=True,           # ошибка одного не убьёт остальных
    )
    valid = [r for r in results if not isinstance(r, Exception)]
    return valid</code></pre>

<p><b>Параллельные LLM-вызовы.</b> Классификация большого списка текстов — не по очереди:</p>

<pre><button class="copy-btn">copy</button><code>async def classify_batch(texts: list, client):
    async def classify_one(text):
        r = await client.chat.completions.create(
            model="gpt-4o-mini",
            messages=[{"role": "user", "content": f"Тональность: {text}"}],
        )
        return r.choices[0].message.content

    # 20 текстов одновременно
    results = await asyncio.gather(*[classify_one(t) for t in texts])
    return results

asyncio.run(classify_batch(texts, client))</code></pre>

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Забывают await</b> — код возвращает корутину вместо результата. Предупреждение «never awaited», но часто игнорируется.</li>
  <li><b>Используют time.sleep</b> — блокирует весь event loop. Замени на <code>asyncio.sleep</code>.</li>
  <li><b>Используют синхронный requests</b> — блокирует loop на время запроса. Замени на httpx.AsyncClient.</li>
  <li><b>Вызывают async-функцию вне async-контекста</b> — синтаксически ок, но не работает. Нужен <code>asyncio.run</code>.</li>
  <li><b>Путают <code>gather</code> и последовательный await</b> — gather запускает параллельно, обычный await — по очереди.</li>
  <li><b>Тяжёлые CPU-вычисления в async</b> — блокируют loop, как sleep. Для CPU — multiprocessing или <code>run_in_executor</code>.</li>
  <li><b>Не обрабатывают исключения в gather</b> — одна упавшая задача отменяет остальные. Используй <code>return_exceptions=True</code>.</li>
</ul>
</div>

<script type="text/template" id="tpl-async-2">
<h3>Теория</h3>

<p>В первом курсе мы запускали корутины по одной через <code>await</code>. Это всё ещё последовательно. Настоящий параллелизм — когда несколько корутин работают одновременно. Для этого в asyncio есть три инструмента: <code>gather</code>, <code>create_task</code>, <code>TaskGroup</code>.</p>

<h4>gather — запустить всех и дождаться</h4>

<p><code>asyncio.gather(*coros)</code> принимает любое количество корутин или Task'ов, запускает их <b>одновременно</b> и ждёт завершения всех. Возвращает список результатов в том же порядке, в котором передал корутины.</p>

<pre><button class="copy-btn">copy</button><code>async def work(name, delay):
    await asyncio.sleep(delay)
    return f"{name} done"

async def main():
    results = await asyncio.gather(
        work("A", 0.5),
        work("B", 0.3),
        work("C", 0.7),
    )
    print(results)   # ['A done', 'B done', 'C done']
    # Общее время — 0.7 секунды (не 1.5!)

asyncio.run(main())</code></pre>

<p><b>Порядок результата = порядок аргументов</b>, даже если задачи завершаются в другом порядке. Это важно для понимания: результаты возвращаются отсортированными по исходному списку.</p>

<h4>Обработка ошибок в gather</h4>

<p>По умолчанию: если одна задача упадёт — <code>gather</code> бросит исключение, но остальные задачи <b>продолжат выполняться в фоне</b>. Это ловушка. Правильный способ:</p>

<pre><button class="copy-btn">copy</button><code># Плохо: падает при первой ошибке, остальные висят
results = await asyncio.gather(a(), b(), c())

# Хорошо: не падает, ошибки как значения
results = await asyncio.gather(a(), b(), c(), return_exceptions=True)
# [result_a, Exception(...), result_c]</code></pre>

<h4>create_task — фоновые задачи</h4>

<p><code>asyncio.create_task(coro)</code> планирует корутину немедленно и возвращает Task. Задача начинает выполняться сразу, а ты можешь делать другое:</p>

<pre><button class="copy-btn">copy</button><code>async def background_job():
    await asyncio.sleep(2)
    print("фон завершён")

async def main():
    task = asyncio.create_task(background_job())   # запущена сразу

    print("делаем своё")
    await asyncio.sleep(0.5)
    print("ещё что-то")

    # ждём завершения фоновой задачи
    await task
    print("всё готово")

asyncio.run(main())</code></pre>

<p>Если не сделать <code>await task</code> — задача может не успеть завершиться при выходе из main. Python выдаст предупреждение «Task was destroyed but it is pending».</p>

<h4>TaskGroup — современный способ (Python 3.11+)</h4>

<p><code>asyncio.TaskGroup</code> — более безопасная альтернатива gather. Все задачи живут в контекстном менеджере. Если одна падает — <b>все остальные отменяются</b>. Никаких висящих задач.</p>

<pre><button class="copy-btn">copy</button><code>async def work(name, delay, fail=False):
    await asyncio.sleep(delay)
    if fail:
        raise RuntimeError(f"{name} failed")
    return f"{name} done"

async def main():
    async with asyncio.TaskGroup() as tg:
        t1 = tg.create_task(work("A", 0.5))
        t2 = tg.create_task(work("B", 0.3))
        t3 = tg.create_task(work("C", 0.7))

    # Все завершены
    print(t1.result(), t2.result(), t3.result())

asyncio.run(main())</code></pre>

<h4>Сравнение трёх подходов</h4>

<table>
  <thead><tr><th>Инструмент</th><th>Когда использовать</th></tr></thead>
  <tbody>
    <tr><td><code>gather</code></td><td>Простой параллельный запуск. Есть с Python 3.4. Универсально.</td></tr>
    <tr><td><code>create_task</code></td><td>Фоновая задача, к которой вернёшься позже. Несколько задач параллельно с разными обработками.</td></tr>
    <tr><td><code>TaskGroup</code></td><td>Современный способ (3.11+). Автоматическая отмена остальных при ошибке.</td></tr>
  </tbody>
</table>

<div class="tip"><b>С 3.11 используй TaskGroup для структурированной конкуррентности.</b> Это стандарт в новом коде. gather остаётся для быстрых однострочников.</div>

<h4>Отмена задач</h4>

<p>Task можно отменить через <code>task.cancel()</code>. Внутри корутины поднимется <code>CancelledError</code>:</p>

<pre><button class="copy-btn">copy</button><code>async def long_job():
    try:
        await asyncio.sleep(10)
    except asyncio.CancelledError:
        print("задача отменена")
        raise

async def main():
    task = asyncio.create_task(long_job())
    await asyncio.sleep(1)
    task.cancel()                    # отменяем
    try:
        await task
    except asyncio.CancelledError:
        print("подтверждено")</code></pre>

<h3>Пошаговый разбор</h3>

<div class="step" data-step="1"><h4>Собрать корутины</h4><p>Список вызовов async-функций (не выполняются, пока не запущены).</p></div>
<div class="step" data-step="2"><h4>gather или TaskGroup</h4><p>Запустить все параллельно. Выбрать по контексту: gather проще, TaskGroup безопаснее.</p></div>
<div class="step" data-step="3"><h4>Обработать результаты</h4><p>Список результатов в порядке исходных корутин. Исключения — через return_exceptions или try/except.</p></div>
<div class="step" data-step="4"><h4>Ограничить параллелизм</h4><p>Если 10 000 задач — упрёшься в rate limit. Semaphore ограничит до N.</p></div>
<div class="step" data-step="5"><h4>Таймаут</h4><p>wait_for на каждую задачу или на весь gather. Иначе один сбойный вызов подвесит всё.</p></div>

<pre><button class="copy-btn">copy</button><code>import asyncio
import time

# === GATHER: базовый ===
async def task(name: str, delay: float):
    await asyncio.sleep(delay)
    return f"{name} done in {delay}s"

async def main_gather():
    t0 = time.perf_counter()
    results = await asyncio.gather(
        task("A", 0.5),
        task("B", 0.3),
        task("C", 0.7),
    )
    print(results)
    print(f"total: {time.perf_counter()-t0:.2f}s")  # ~0.7s

asyncio.run(main_gather())

# === GATHER с return_exceptions ===
async def might_fail(name: str, fail: bool):
    await asyncio.sleep(0.2)
    if fail:
        raise ValueError(f"{name} failed")
    return f"{name} ok"

async def main_safe():
    results = await asyncio.gather(
        might_fail("A", False),
        might_fail("B", True),
        might_fail("C", False),
        return_exceptions=True,
    )
    for r in results:
        if isinstance(r, Exception):
            print(f"error: {r}")
        else:
            print(f"ok: {r}")

asyncio.run(main_safe())

# === CREATE_TASK ===
async def main_background():
    # Запуск в фоне
    task1 = asyncio.create_task(task("bg1", 1.0))
    task2 = asyncio.create_task(task("bg2", 0.5))

    # Делаем другое
    print("основной код работает")
    await asyncio.sleep(0.2)
    print("ещё работа")

    # Ждём задачи
    r1 = await task1
    r2 = await task2
    print(r1, r2)

asyncio.run(main_background())

# === TASKGROUP (3.11+) ===
async def main_taskgroup():
    async with asyncio.TaskGroup() as tg:
        t1 = tg.create_task(task("A", 0.3))
        t2 = tg.create_task(task("B", 0.5))
        t3 = tg.create_task(task("C", 0.2))

    print(t1.result(), t2.result(), t3.result())

asyncio.run(main_taskgroup())

# === ОГРАНИЧЕНИЕ ЧЕРЕЗ SEMAPHORE ===
async def limited(sem: asyncio.Semaphore, name: str):
    async with sem:
        print(f"start {name}")
        await asyncio.sleep(0.5)
        print(f"end {name}")

async def main_limited():
    sem = asyncio.Semaphore(3)          # не больше 3 одновременно
    await asyncio.gather(*[limited(sem, f"task-{i}") for i in range(10)])

asyncio.run(main_limited())</code></pre>

<h3>Где это работает в Agentic</h3>

<p><b>Обработка стрима нескольких LLM.</b> Запустить 3 разные модели параллельно, взять лучший ответ:</p>

<pre><button class="copy-btn">copy</button><code>async def ask_multiple(prompt, models=["gpt-4o", "claude-3.5", "gemini-1.5"]):

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Пишут <code>[a(), b(), c()]</code> без gather</b> — создают список корутин, не запускают их. Нужно <code>gather</code> или <code>create_task</code>.</li>
  <li><b>Используют gather для последовательных зависимостей</b> — если задача B зависит от A, их нельзя параллелить.</li>
  <li><b>Не ограничивают параллелизм</b> — 10 000 задач сразу → rate limit, таймауты, крэш. Semaphore решает.</li>
  <li><b>Не обрабатывают ошибки в gather</b> — одна ошибка убивает остальные. <code>return_exceptions=True</code>.</li>
  <li><b>Не делают await на созданный Task</b> — задача висит, при выходе из main получишь предупреждение.</li>
  <li><b>Используют gather внутри циклов</b> — теряется параллелизм. Один gather на весь список задач.</li>
  <li><b>Не ставят таймауты</b> — один зависший вызов блокирует весь gather.</li>
</ul>
</div>

<script type="text/template" id="tpl-async-3">
<h3>Теория</h3>

<p>Работа с HTTP — основа любого агента. Модель вызывает LLM API, инструменты дёргают сторонние сервисы, RAG ходит в базу. Всё это — HTTP. В Python есть два стандарта: старый синхронный <code>requests</code> и современный асинхронный <code>httpx</code>.</p>

<h4>Почему httpx, а не requests</h4>

<table>
  <thead><tr><th>Свойство</th><th>requests</th><th>httpx</th></tr></thead>
  <tbody>
    <tr><td>Синхронный</td><td>Да</td><td>Да</td></tr>
    <tr><td>Асинхронный</td><td>Нет</td><td>Да</td></tr>
    <tr><td>HTTP/2</td><td>Нет</td><td>Да</td></tr>
    <tr><td>Пул соединений</td><td>Через Session</td><td>Через Client</td></tr>
    <tr><td>Таймауты по умолчанию</td><td>Нет (баг)</td><td>Есть (5 секунд)</td></tr>
    <tr><td>Стриминг</td><td>Есть</td><td>Есть, лучше</td></tr>
  </tbody>
</table>

<p>Для агентов <b>всегда httpx</b>. Синхронный requests блокирует event loop, а это убивает весь смысл async.</p>

<h4>Синхронный клиент</h4>

<pre><button class="copy-btn">copy</button><code>import httpx

# Одиночный запрос
r = httpx.get("https://httpbin.org/get", timeout=10)
print(r.status_code)
print(r.json())
print(r.text)

# POST с JSON
r = httpx.post(
    "https://httpbin.org/post",
    json={"name": "Alice"},
    timeout=10,
)
print(r.json())</code></pre>

<h4>Асинхронный клиент</h4>

<pre><button class="copy-btn">copy</button><code>import httpx
import asyncio

async def main():
    async with httpx.AsyncClient(timeout=15) as client:
        r = await client.get("https://httpbin.org/get")
        print(r.status_code)

        r = await client.post(
            "https://httpbin.org/post",
            json={"name": "Alice"},
        )
        print(r.json())

asyncio.run(main())</code></pre>

<div class="tip"><b>Клиент — контекстный менеджер.</b> <code>async with httpx.AsyncClient() as c:</code> — открывает пул соединений, закрывает при выходе. Не создавай новый клиент на каждый запрос — теряешь весь выигрыш от пула.</div>

<h4>Таймауты — всегда</h4>

<p>Без таймаута запрос может висеть бесконечно. httpx по умолчанию даёт 5 секунд, но лучше указать явно:</p>

<pre><button class="copy-btn">copy</button><code># Таймаут на всё
async with httpx.AsyncClient(timeout=30) as c:
    ...

# Детальные таймауты
timeout = httpx.Timeout(
    connect=5.0,      # подключение
    read=30.0,        # чтение ответа
    write=10.0,       # отправка тела
    pool=5.0,         # ожидание свободного соединения
)
async with httpx.AsyncClient(timeout=timeout) as c:
    ...</code></pre>

<h4>Заголовки и авторизация</h4>

<pre><button class="copy-btn">copy</button><code>headers = {
    "Authorization": "Bearer sk-xxx",
    "Content-Type": "application/json",
    "User-Agent": "my-agent/1.0",
}
async with httpx.AsyncClient(headers=headers) as c:
    r = await c.get("https://api.example.com/data")</code></pre>

<h4>Обработка ошибок</h4>

<p>httpx различает сетевые ошибки и HTTP-статусы:</p>

<pre><button class="copy-btn">copy</button><code>import httpx

try:
    async with httpx.AsyncClient() as c:
        r = await c.get(url, timeout=10)
        r.raise_for_status()               # 4xx/5xx → HTTPStatusError
except httpx.TimeoutException:
    print("timeout")
except httpx.ConnectError:
    print("не подключиться")
except httpx.HTTPStatusError as e:
    print(f"HTTP {e.response.status_code}: {e.response.text}")
except httpx.HTTPError as e:
    print(f"общая ошибка: {e}")</code></pre>

<h4>Параметры, JSON, форма</h4>

<pre><button class="copy-btn">copy</button><code># Query params
r = await c.get("https://api.example.com/search", params={"q": "python", "limit": 10})
# GET /search?q=python&amp;limit=10

# JSON body
r = await c.post(url, json={"model": "gpt-4o", "messages": [...]})

# Form data
r = await c.post(url, data={"username": "alice", "password": "xxx"})

# Файлы
r = await c.post(url, files={"file": open("photo.jpg", "rb")})

# Стриминг большого ответа
async with c.stream("GET", url) as r:
    async for chunk in r.aiter_bytes():
        process(chunk)</code></pre>

<h4>Retry — обязательный паттерн</h4>

<p>Сеть падает. Сделай retry с backoff:</p>

<pre><button class="copy-btn">copy</button><code>async def fetch_with_retry(url, attempts=3):
    async with httpx.AsyncClient(timeout=10) as c:
        for i in range(attempts):
            try:
                r = await c.get(url)
                r.raise_for_status()
                return r.json()
            except (httpx.TimeoutException, httpx.ConnectError):
                if i == attempts - 1:
                    raise
                await asyncio.sleep(2 ** i)</code></pre>

<h3>Пошаговый разбор</h3>

<div class="step" data-step="1"><h4>Создать клиент</h4><p>Один на весь модуль или функцию. Через <code>async with</code>.</p></div>
<div class="step" data-step="2"><h4>Указать таймаут</h4><p>5–10 секунд для обычных API, 30–60 для LLM. Всегда явно.</p></div>
<div class="step" data-step="3"><h4>Сделать запрос</h4><p><code>await client.get/post/put/delete(url, ...)</code>. Проверить статус через raise_for_status.</p></div>
<div class="step" data-step="4"><h4>Обработать ошибки</h4><p>Отдельные except для timeout, connect, http status, общее. Retry для временных.</p></div>
<div class="step" data-step="5"><h4>Закрыть клиент</h4><p>Автоматически через контекстный менеджер. Не забывай использовать <code>async with</code>.</p></div>

<pre><button class="copy-btn">copy</button><code>import httpx
import asyncio
import json

# === ПРОСТОЙ ЗАПРОС ===
async def simple_get():
    async with httpx.AsyncClient(timeout=10) as c:
        r = await c.get("https://httpbin.org/get")
        r.raise_for_status()
        return r.json()

# === POST С JSON ===
async def post_json():
    async with httpx.AsyncClient(timeout=10) as c:
        r = await c.post(
            "https://httpbin.org/post",
            json={"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "hi"}]},
        )
        return r.json()

# === ЗАГОЛОВКИ ===
async def with_headers():
    headers = {
        "Authorization": "Bearer sk-test",
        "X-Custom": "value",
    }
    async with httpx.AsyncClient(headers=headers, timeout=10) as c:
        r = await c.get("https://httpbin.org/headers")
        return r.json()

# === ПАРАЛЛЕЛЬНЫЕ ЗАПРОСЫ ===
async def parallel_fetch(urls):
    async with httpx.AsyncClient(timeout=10) as c:
        tasks = [c.get(url) for url in urls]
        responses = await asyncio.gather(*tasks, return_exceptions=True)
        return [
            r.json() if not isinstance(r, Exception) else {"error": str(r)}
            for r in responses
        ]

# === RETRY С BACKOFF ===
async def fetch_retry(url, attempts=3, base_delay=0.5):
    async with httpx.AsyncClient(timeout=10) as c:
        for i in range(attempts):
            try:
                r = await c.get(url)
                r.raise_for_status()
                return r.json()
            except (httpx.TimeoutException, httpx.ConnectError) as e:
                if i == attempts - 1:
                    raise
                delay = base_delay * (2 ** i)
                print(f"retry in {delay}s: {e}")
                await asyncio.sleep(delay)

# === СТРИМИНГ ===
async def stream_response(url):
    async with httpx.AsyncClient(timeout=30) as c:
        async with c.stream("GET", url) as r:
            async for chunk in r.aiter_text():
                print(chunk, end="", flush=True)

# === ЗАПУСК ===
async def main():
    result = await simple_get()
    print("simple:", result["headers"]["Host"])

    result = await post_json()
    print("post:", result["json"])

    result = await with_headers()
    print("headers:", result["headers"])

    results = await parallel_fetch([
        "https://httpbin.org/get",
        "https://httpbin.org/uuid",
        "https://httpbin.org/ip",
    ])
    print("parallel:", len(results), "results")

asyncio.run(main())</code></pre>

<h3>Где это работает в Agentic</h3>

<p><b>Обёртка вокруг LLM API.</b> Один клиент, retry, таймауты, метрики:</p>

<pre><button class="copy-btn">copy</button><code>class LLMClient:
    def __init__(self, api_key: str, base_url: str = "https://api.openai.com/v1"):
        self.client = httpx.AsyncClient(
            base_url=base_url,
            headers={"Authorization": f"Bearer {api_key}"},
            timeout=httpx.Timeout(60.0, connect=10.0),
        )

    async def chat(self, model: str, messages: list, **kwargs):
        for i in range(3):
            try:
                r = await self.client.post(
                    "/chat/completions",
                    json={"model": model, "messages": messages, **kwargs},
                )
                r.raise_for_status()
                return r.json()
            except httpx.HTTPStatusError as e:
                if e.response.status_code &lt; 500 and e.response.status_code != 429:
                    raise
                if i == 2:
                    raise
                await asyncio.sleep(2 ** i)
            except httpx.TimeoutException:
                if i == 2:
                    raise
                await asyncio.sleep(2 ** i)

    async def close(self):
        await self.client.aclose()</code></pre>

<p><b>Инструмент поиска в вебе.</b> Агент вызывает инструмент — инструмент делает HTTP:</p>

<pre><button class="copy-btn">copy</button><code>async def web_search(query: str, api_key: str) -&gt; list:
    async with httpx.AsyncClient(timeout=15) as c:
        r = await c.get(
            "https://api.search-provider.com/search",
            params={"q": query, "limit": 5},
            headers={"X-API-Key": api_key},
        )
        r.raise_for_status()
        return [
            {"title": item["title"], "url": item["url"], "snippet": item["snippet"]}
            for item in r.json()["results"]
        ]</code></pre>

<p><b>Параллельный fetch документов для RAG.</b> Загружаем 20 документов одновременно:</p>

<pre><button class="copy-btn">copy</button><code>async def fetch_documents(urls: list, concurrency: int = 10) -&gt; list:
    sem = asyncio.Semaphore(concurrency)

    async with httpx.AsyncClient(timeout=30, follow_redirects=True) as c:
        async def fetch_one(url):
            async with sem:
                try:
                    r = await c.get(url)
                    r.raise_for_status()
                    return {"url": url, "content": r.text}
                except Exception as e:
                    return {"url": url, "error": str(e)}

        return await asyncio.gather(*[fetch_one(u) for u in urls])</code></pre>

<p><b>Стриминг ответа для UI.</b> Через SSE или chunked — отдаём пользователю по мере прихода:</p>

<pre><button class="copy-btn">copy</button><code>async def stream_llm(prompt: str):
    async with httpx.AsyncClient(timeout=60) as c:
        async with c.stream(
            "POST",
            "https://api.openai.com/v1/chat/completions",
            json={
                "model": "gpt-4o-mini",

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Создают клиент на каждый запрос</b> — теряют пул соединений, каждый запрос открывает новое TCP-подключение. Один клиент на модуль.</li>
  <li><b>Не ставят таймаут</b> — запрос виснет навсегда. Всегда явно.</li>
  <li><b>Забывают raise_for_status</b> — 500-я ошибка проходит как «успех», и ты обрабатываешь error-body как данные.</li>
  <li><b>Используют requests в async-коде</b> — блокирует весь loop. Только httpx.AsyncClient.</li>
  <li><b>Не делают retry</b> — одна сетевая глюка — потеря данных. Retry обязателен.</li>
  <li><b>Не закрывают клиент</b> — утечка соединений. <code>async with</code> решает.</li>
  <li><b>Отправляют пароли в query params</b> — они попадут в логи. Только headers или body.</li>
  <li><b>Не проверяют content-type</b> — пытаются парсить HTML как JSON. Проверяй или оборачивай в try/except.</li>
</ul>
</div>

<h3>Упражнения</h3>

<div class="exercise">

<h3>Теория</h3>

<p>JSON — стандарт обмена данными. Любой API, любой ответ LLM, любой конфиг — это JSON. В Python есть встроенный модуль <code>json</code>, но в Agentic часто встречаются подводные камни.</p>

<h4>Соответствие типов JSON ↔ Python</h4>

<table>
  <thead><tr><th>JSON</th><th>Python</th><th>Заметка</th></tr></thead>
  <tbody>
    <tr><td><code>object</code></td><td><code>dict</code></td><td>Ключи всегда строки</td></tr>
    <tr><td><code>array</code></td><td><code>list</code></td><td>Порядок сохраняется</td></tr>
    <tr><td><code>string</code></td><td><code>str</code></td><td>Юникод</td></tr>
    <tr><td><code>number</code> (int)</td><td><code>int</code></td><td>Без точки</td></tr>
    <tr><td><code>number</code> (float)</td><td><code>float</code></td><td>IEEE 754</td></tr>
    <tr><td><code>true</code>/<code>false</code></td><td><code>True</code>/<code>False</code></td><td>Регистр важен</td></tr>
    <tr><td><code>null</code></td><td><code>None</code></td><td>Единственный экземпляр</td></tr>
  </tbody>
</table>

<p><b>Чего нет в JSON:</b> tuple (станет list), set (станет list), datetime (станет строкой или ошибкой), bytes, complex, Decimal.</p>

<h4>dumps и loads</h4>

<pre><button class="copy-btn">copy</button><code>import json

<h4>dumps параметры</h4>

<table>

  <tbody>
    <tr><td><code>ensure_ascii=False</code></td><td>Не экранирует юникод</td><td>Читаемый русский текст</td></tr>
    <tr><td><code>indent=2</code></td><td>Отступы</td><td>Читаемость</td></tr>
    <tr><td><code>sort_keys=True</code></td><td>Сортировать ключи</td><td>Детерминированный вывод</td></tr>
    <tr><td><code>default=str</code></td><td>Как сериализовать не-JSON</td><td>datetime → ISO-строка</td></tr>
    <tr><td><code>separators=(',', ':')</code></td><td>Компактный</td><td>Для API — меньше токенов</td></tr>
  </tbody>
</table>

<pre><button class="copy-btn">copy</button><code>import json

<table>

<h4>Строгий JSON vs Python-подобный</h4>

<p>JSON строже Python. Распространённые проблемы:</p>

<table>
  <thead><tr><th>Проблема</th><th>Причина</th></tr></thead>
  <tbody>

    <tr><td>Комментарии</td><td>JSON без комментариев</td></tr>
    <tr><td>NaN, Infinity</td><td>Не стандарт, но Python парсит</td></tr>

  </tbody>
</table>

<h3>Пошаговый разбор</h3>

<div class="step" data-step="1"><h4>dumps с настройками</h4><p>ensure_ascii=False для русских букв. indent=2 для читаемости. Для API — компактный, без indent.</p></div>
<div class="step" data-step="2"><h4>loads в try/except</h4><p>Строка от LLM может быть невалидным JSON. Лови JSONDecodeError явно.</p></div>
<div class="step" data-step="3"><h4>Безопасный доступ</h4><p>Цепочки get для вложенных структур. Функция get_path для удобства.</p></div>
<div class="step" data-step="4"><h4>Файлы через pathlib</h4><p>read_text / write_text вместо open. С encoding="utf-8" обязательно.</p></div>
<div class="step" data-step="5"><h4>default=str для сериализации</h4><p>datetime, Decimal, UUID — конвертируй явно или через default.</p></div>

<pre><button class="copy-btn">copy</button><code>import json

    "model": "gpt-4o-mini",

    try:
        return json.loads(text)
    except json.JSONDecodeError as e:
        print(f"invalid json: {e}")
        return {}

print(safe_parse('{"a": 1}'))          # {'a': 1}
print(safe_parse('{"a": 1,}'))         # {} + ошибка

            if d is None:

    return d

data = {

    "usage": {"prompt_tokens": 10},

print(get_path(data, "usage.completion_tokens", 0))       # 0

<h3>Где это работает в Agentic</h3>

<p><b>Сборка payload для LLM API.</b> Каждый запрос — это JSON. Компактный формат экономит токены:</p>

<pre><button class="copy-btn">copy</button><code>def build_payload(model: str, messages: list, tools: list = None, **params):
    payload = {"model": model, "messages": messages, **params}
    if tools:
        payload["tools"] = tools
    return payload

payload = build_payload(
    "gpt-4o-mini",
    [{"role": "user", "content": "Привет"}],
    temperature=0.7,
    max_tokens=500,
)

# Отправка через httpx
r = await client.post("/chat/completions", json=payload)</code></pre>

<p><b>Парсинг ответа LLM.</b> Модель может вернуть разное — цепочки get спасают:</p>

<pre><button class="copy-btn">copy</button><code>def parse_llm_response(response: dict) -&gt; dict:
    """Извлекает content и tool_calls безопасно."""
    result = {"content": None, "tool_calls": None, "usage": {}}

    choices = response.get("choices") or []
    if not choices:
        return result

    message = choices[0].get("message", {})
    result["content"] = message.get("content")
    result["tool_calls"] = message.get("tool_calls")
    result["usage"] = response.get("usage", {})

    return result</code></pre>

<p><b>Парсинг tool call arguments.</b> Модель возвращает аргументы как JSON-строку. Её надо распарсить:</p>

<pre><button class="copy-btn">copy</button><code>def parse_tool_args(call) -&gt; dict:
    """Парсит аргументы с защитой от невалидного JSON."""
    raw = call.function.arguments
    if isinstance(raw, dict):
        return raw   # уже распарсено

    try:
        return json.loads(raw)
    except json.JSONDecodeError as e:
        log.error(f"invalid tool args for {call.function.name}: {raw}")
        return {}</code></pre>

<p><b>Снятие markdown-обёртки.</b> Модель часто оборачивает JSON в тройные бэктики:</p>

<pre><button class="copy-btn">copy</button><code>def strip_markdown_json(raw: str) -&gt; str:
    """Убирает ```json ... ``` обёртку."""
    s = raw.strip()
    bt = chr(96) * 3             # три обратных кавычки

    if s.startswith(bt):
        # Отрезаем первую строку (там может быть ```json)
        first_newline = s.find(chr(10))
        if first_newline != -1:
            s = s[first_newline + 1:]
        if s.endswith(bt):
            s = s[:-3]
    return s.strip()

raw = chr(96)*3 + "json\n" + '{"result": 42}' + chr(10) + chr(96)*3
clean = strip_markdown_json(raw)
print(clean)   # {"result": 42}
print(json.loads(clean))   # {'result': 42}</code></pre>

<p><b>Логирование структурное.</b> Логи в JSON — машиночитаемо, легко парсить:</p>

<pre><button class="copy-btn">copy</button><code>import json
import logging

def log_json(logger, level, event, **fields):
    payload = {"event": event, **fields}
    logger.log(level, json.dumps(payload, ensure_ascii=False))

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Забывают ensure_ascii=False</b> — русский текст превращается в <code>\u041f\u0440...</code>. Читать невозможно.</li>
  <li><b>Не ловят JSONDecodeError</b> — невалидный JSON от LLM роняет программу. Всегда try/except.</li>
  <li><b>Используют <code>eval</code> для парсинга</b> — опасно и медленно. Только <code>json.loads</code>.</li>
  <li><b>Забывают про trailing comma</b> — <code>{"a": 1,}</code> в JSON невалиден, хотя Python понимает.</li>
  <li><b>Думают, что порядок ключей гарантирован</b> — в JSON порядок формально не определён. Полагайся на порядок только если сам его задаёшь.</li>
  <li><b>Сериализуют datetime напрямую</b> — TypeError. Нужен default=str или явное преобразование.</li>
  <li><b>Пишут/читают без encoding</b> — на Windows может быть cp1251. Всегда utf-8.</li>
  <li><b>Падают на <code>data["a"]["b"]</code> без проверки</b> — KeyError. Используй цепочку get для ненадёжных данных.</li>
  <li><b>Отправляют JSON с indent=2 в API</b> — лишние токены. Для запросов — компактный.</li>
</ul>
</div>

<script type="text/template" id="tpl-async-5">
<h3>Теория</h3>

<p>Pydantic — библиотека валидации данных через аннотации типов. Ты описываешь класс со схемой, Pydantic проверяет входные данные и даёт типизированный объект. В Agentic это критично: LLM возвращает текст, ты должен превратить его в валидную структуру или явно упасть.</p>

<h4>Зачем Pydantic, если есть dict</h4>

<table>
  <thead><tr><th>Проблема</th><th>dict</th><th>Pydantic</th></tr></thead>
  <tbody>
    <tr><td>Типы</td><td>Не проверяются</td><td>Проверяются</td></tr>
    <tr><td>Обязательные поля</td><td>Забыл — ошибка в рантайме</td><td>Забыл — ValidationError сразу</td></tr>
    <tr><td>Автодополнение в IDE</td><td>Нет</td><td>Да</td></tr>
    <tr><td>Дефолты</td><td>Вручную через get</td><td>Через Field</td></tr>
    <tr><td>Вложенность</td><td>Проверяешь руками</td><td>Автоматически</td></tr>
    <tr><td>Сериализация</td><td>Вручную</td><td>model_dump()</td></tr>
    <tr><td>Документация</td><td>Нет</td><td>JSON Schema автоматически</td></tr>
  </tbody>
</table>

<h4>BaseModel — основа</h4>

<pre><button class="copy-btn">copy</button><code>from pydantic import BaseModel, Field
from typing import Literal

class Message(BaseModel):
    role: Literal["system", "user", "assistant", "tool"]
    content: str = Field(min_length=1, max_length=10000)

class ChatRequest(BaseModel):
    model: str = "gpt-4o-mini"
    messages: list[Message]
    temperature: float = Field(ge=0, le=2, default=0.7)
    max_tokens: int = Field(gt=0, default=500)

# Создание с валидацией
req = ChatRequest(
    messages=[
        {"role": "user", "content": "Привет"},
    ],
    temperature=0.2,
)
print(req.model_dump())
# {'model': 'gpt-4o-mini', 'messages': [{'role': 'user', 'content': 'Привет'}], ...}</code></pre>

<h4>Field — ограничения и метаданные</h4>

<table>
  <thead><tr><th>Параметр</th><th>Для чего</th><th>Пример</th></tr></thead>
  <tbody>
    <tr><td><code>default</code></td><td>Значение по умолчанию</td><td><code>Field(default=0)</code></td></tr>
    <tr><td><code>default_factory</code></td><td>Фабрика для изменяемых</td><td><code>Field(default_factory=list)</code></td></tr>
    <tr><td><code>ge</code> / <code>gt</code></td><td>Больше или равно / больше</td><td><code>Field(ge=0)</code></td></tr>
    <tr><td><code>le</code> / <code>lt</code></td><td>Меньше или равно / меньше</td><td><code>Field(le=2)</code></td></tr>
    <tr><td><code>min_length</code></td><td>Минимум элементов</td><td><code>Field(min_length=1)</code></td></tr>
    <tr><td><code>max_length</code></td><td>Максимум элементов</td><td><code>Field(max_length=100)</code></td></tr>
    <tr><td><code>pattern</code></td><td>Regex</td><td><code>Field(pattern=r"^[a-z]+$")</code></td></tr>
    <tr><td><code>description</code></td><td>Для схемы и LLM</td><td><code>Field(description="...")</code></td></tr>
  </tbody>
</table>

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Изменяемые дефолты в Field</b> — <code>Field(default=[])</code> — та же ловушка, что в функциях. Только <code>default_factory=list</code>.</li>
  <li><b>Забывают про model_config = {"env_file": ".env"}</b> — Settings не читает .env. Нужно указать явно.</li>
  <li><b>Валидируют вручную</b> — <code>if "name" not in data</code>. Pydantic делает это лучше. Описывай схему, лови ValidationError.</li>
  <li><b>Создают модели без описаний Field</b> — LLM не понимает, что в поле. Description критичен для tool schema.</li>
  <li><b>Используют <code>dict</code> вместо Pydantic в инструментах</b> — теряют валидацию и автодополнение.</li>
  <li><b>Не различают <code>model_dump()</code> и <code>model_dump_json()</code></b> — первый возвращает dict, второй — строку.</li>
  <li><b>Изменяют поля модели после создания</b> — если не frozen=True, можно. Но лучше — иммутабельность.</li>
  <li><b>Оборачивают всё в try/except Exception</b> — теряют конкретику. Лови именно ValidationError.</li>
</ul>
</div>

<h3>Теория</h3>

<p>Секреты в коде — классическая ошибка, которая ломает проекты. API-ключи, пароли БД, JWT — всё это не должно быть в исходниках. Плюс разные окружения требуют разных настроек: dev, staging, prod. Отсюда паттерн <b>12-factor app</b> — конфигурация через переменные окружения.</p>

<h4>Что нельзя делать</h4>

<pre><button class="copy-btn">copy</button><code># ПЛОХО: ключ в коде

# ПЛОХО: ключ в git
# .env с реальными значениями закоммичен

# ПЛОХО: ключ в логах

<p><b>Чем это плохо:</b></p>
<ol>
  <li>Любой, кто имеет доступ к репозиторию — имеет доступ к ключам</li>
  <li>История git хранит всё навсегда, даже если удалить файл</li>
  <li>Невозможно сменить настройки без изменения кода</li>
  <li>Разные окружения требуют разных ключей</li>
</ol>

<h4>os.environ и os.getenv</h4>

<pre><button class="copy-btn">copy</button><code>import os

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Коммитят .env</b> — утечка ключей. Всегда в .gitignore. Если уже закоммитил — смени ключи, они скомпрометированы навсегда.</li>
  <li><b>Читают os.environ по всему коду</b> — 50 мест, где может упасть. Один settings-объект.</li>
  <li><b>Логируют settings целиком</b> — ключи в логах. Используй SecretStr или ручной safe-метод.</li>
  <li><b>Хардкодят дефолты в prod-коде</b> — «если ключа нет, используй тестовый». В prod это катастрофа.</li>
  <li><b>Не используют env_file в Settings</b> — нужно явно указать конфиг, иначе не читает .env.</li>
  <li><b>Забывают encoding</b> — на Windows .env в cp1251, а Python ждёт utf-8. Всегда явно.</li>
  <li><b>Передают секреты в URL</b> — <code>https://api.com?key=xxx</code> — попадёт в логи провайдера и трекеры.</li>
  <li><b>Хранят секреты в коде CI</b> — workflow.yml с ключами. Используй GitHub Secrets.</li>
</ul>
</div>

<script type="text/template" id="tpl-async-7">
<h3>Теория</h3>

<p>Логирование — то, что отличает игрушку от продакшна. Когда агент падает в 3 часа ночи, единственное, что у тебя есть — логи. Без них ты слеп. <code>print</code> для быстрых экспериментов, но в проекте — <code>logging</code>.</p>

<h4>Почему не print</h4>

<table>
  <thead><tr><th>Свойство</th><th>print</th><th>logging</th></tr></thead>
  <tbody>
    <tr><td>Уровни</td><td>Нет</td><td>DEBUG, INFO, WARNING, ERROR, CRITICAL</td></tr>
    <tr><td>Отключение</td><td>Закомментировать</td><td>Уровень через конфиг</td></tr>
    <tr><td>Время</td><td>Вручную</td><td>Автоматически</td></tr>
    <tr><td>Источник</td><td>Нет</td><td>Имя модуля</td></tr>
    <tr><td>Куда вывод</td><td>Только stdout</td><td>stdout, файл, syslog, внешние сервисы</td></tr>
    <tr><td>Формат</td><td>Свой</td><td>Стандартизированный</td></tr>
    <tr><td>Производительность</td><td>Всегда выполняется</td><td>Можно отключить полностью</td></tr>
  </tbody>
</table>

<h4>Уровни логирования</h4>

<table>
  <thead><tr><th>Уровень</th><th>Число</th><th>Когда использовать</th></tr></thead>
  <tbody>
    <tr><td>DEBUG</td><td>10</td><td>Детали для отладки: значения переменных, шаги</td></tr>
    <tr><td>INFO</td><td>20</td><td>Обычные события: старт, конец, ключевые действия</td></tr>
    <tr><td>WARNING</td><td>30</td><td>Что-то подозрительное, но работа продолжается</td></tr>
    <tr><td>ERROR</td><td>40</td><td>Ошибка в операции, но приложение живо</td></tr>
    <tr><td>CRITICAL</td><td>50</td><td>Катастрофа, приложение не может продолжать</td></tr>
  </tbody>
</table>

<p><b>Правило:</b> если уровень WARNING в логах — что-то стоит проверить. ERROR — срочно. CRITICAL — падает вся система.</p>

<h4>Базовая настройка</h4>

<pre><button class="copy-btn">copy</button><code>import logging

logging.basicConfig(
    level=logging.INFO,
    format="%(asctime)s [%(levelname)s] %(name)s: %(message)s",
    datefmt="%Y-%m-%d %H:%M:%S",
)

log = logging.getLogger(__name__)          # имя = имя модуля

log.debug("детали")                         # не покажется (уровень INFO)
log.info("приложение стартовало")           # покажется
log.warning("подозрительно")                # покажется
log.error("ошибка")                         # покажется
log.critical("катастрофа")                  # покажется</code></pre>

<h4>Логгер по модулю</h4>

<p><code>logging.getLogger(__name__)</code> создаёт логгер с именем модуля. Когда логов много — по имени видно, откуда идёт сообщение:</p>

<pre><button class="copy-btn">copy</button><code># my_agent/agent.py
import logging
log = logging.getLogger(__name__)          # my_agent.agent

# my_agent/tools.py
import logging
log = logging.getLogger(__name__)          # my_agent.tools

# При логе:
# 2026-05-20 12:00:00 [INFO] my_agent.agent: Agent started
# 2026-05-20 12:00:01 [INFO] my_agent.tools: Calling search</code></pre>

<h4>Что логировать в агенте</h4>

<p>Ключевые события и метрики:</p>

<table>
  <thead><tr><th>Событие</th><th>Уровень</th><th>Что включить</th></tr></thead>
  <tbody>
    <tr><td>Старт агента</td><td>INFO</td><td>model, max_steps, tools</td></tr>
    <tr><td>Запрос к LLM</td><td>DEBUG</td><td>messages, model, temperature</td></tr>
    <tr><td>Ответ LLM</td><td>INFO</td><td>tokens_in, tokens_out, latency, cost</td></tr>
    <tr><td>Вызов инструмента</td><td>INFO</td><td>name, args, latency</td></tr>
    <tr><td>Ошибка инструмента</td><td>ERROR</td><td>name, args, exception</td></tr>
    <tr><td>Retry</td><td>WARNING</td><td>attempt, reason, delay</td></tr>
    <tr><td>Финальный ответ</td><td>INFO</td><td>total_steps, total_cost, total_latency</td></tr>
    <tr><td>Ошибка LLM API</td><td>ERROR</td><td>status, response_body</td></tr>
    <tr><td>Превышение бюджета</td><td>CRITICAL</td><td>limit, spent</td></tr>
  </tbody>
</table>

<h4>Структурное логирование</h4>

<p>Печатать словами — плохо для парсинга. Лучше — JSON-строки:</p>

<pre><button class="copy-btn">copy</button><code>import json
import logging

def log_event(logger, level, event, **fields):
    payload = {"event": event, **fields}
    logger.log(level, json.dumps(payload, ensure_ascii=False))

log_event(log, logging.INFO, "llm_call",
    model="gpt-4o-mini",
    tokens_in=120,
    tokens_out=80,
    latency_ms=1234,
    cost_usd=0.00012,
)
# {"event": "llm_call", "model": "gpt-4o-mini", ...}</code></pre>

<p>Плюсы JSON:</p>
<ol>
  <li>Легко парсить скриптами и ELK/Splunk</li>
  <li>Можно агрегировать: например, «средний latency по модели»</li>
  <li>Структура всегда одна, не надо regex'ов</li>
</ol>

<h4>Формат лога</h4>

<pre><button class="copy-btn">copy</button><code># Базовый формат
format="%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# С тредами
format="%(asctime)s [%(levelname)s] %(name)s [%(threadName)s]: %(message)s"

# С файлом и строкой
format="%(asctime)s [%(levelname)s] %(name)s:%(lineno)d: %(message)s"

# Доступные поля
# %(asctime)s       — время
# %(levelname)s     — уровень
# %(name)s          — имя логгера
# %(message)s       — текст
# %(lineno)d        — строка
# %(filename)s      — имя файла
# %(funcName)s      — имя функции
# %(threadName)s    — поток
# %(process)d       — PID</code></pre>

<h4>Запись в файл</h4>

<pre><button class="copy-btn">copy</button><code>logging.basicConfig(
    level=logging.INFO,
    format="%(asctime)s [%(levelname)s] %(message)s",
    handlers=[
        logging.FileHandler("app.log", encoding="utf-8"),
        logging.StreamHandler(),
    ],
)</code></pre>

<h4>Ротация логов</h4>

<p>Логи растут. Файл на 10 ГБ — проблема. RotatingFileHandler ограничивает размер:</p>

<pre><button class="copy-btn">copy</button><code>from logging.handlers import RotatingFileHandler

handler = RotatingFileHandler(
    "app.log",
    maxBytes=10_000_000,            # 10 МБ
    backupCount=5,                  # 5 старых файлов
    encoding="utf-8",
)

logging.basicConfig(
    level=logging.INFO,
    format="%(asctime)s [%(levelname)s] %(message)s",
    handlers=[handler],
)</code></pre>

<h3>Пошаговый разбор</h3>

<div class="step" data-step="1"><h4>basicConfig один раз</h4><p>При старте приложения. Формат, уровень, handlers. Больше нигде не вызывать.</p></div>
<div class="step" data-step="2"><h4>getLogger в каждом модуле</h4><p><code>log = logging.getLogger(__name__)</code>. Имя = путь модуля.</p></div>
<div class="step" data-step="3"><h4>Уровень из конфига</h4><p>Не хардкод. <code>logging.basicConfig(level=settings.log_level)</code>.</p></div>
<div class="step" data-step="4"><h4>Структурные события</h4><p>Ключевые операции — через JSON. Свободные сообщения — простым форматом.</p></div>
<div class="step" data-step="5"><h4>Никогда не логируй секреты</h4><p>API-ключи, пароли, PII. Маскируй или вообще не пиши.</p></div>

<pre><button class="copy-btn">copy</button><code>import logging
import json

<h3>Где это работает в Agentic</h3>

<p><b>Логирование каждого шага агента.</b> Когда агент зацикливается, ты видишь, где:</p>

<pre><button class="copy-btn">copy</button><code>async def run_agent(question: str) -&gt; str:
    log_event("agent_started", question=question[:100])
    messages = [{"role": "user", "content": question}]

    for step in range(10):
        log_event("agent_step", step=step, num_messages=len(messages))

        response = await llm.chat(messages)
        log_event("llm_response",
            step=step,
            content_len=len(response.content or ""),
            tool_calls=len(response.tool_calls or []),
        )

        if not response.tool_calls:
            log_event("agent_finished", steps=step+1)
            return response.content

        for call in response.tool_calls:
            log_event("tool_call", name=call.function.name, args=call.function.arguments)
            try:
                result = await execute_tool(call)
                log_event("tool_result", name=call.function.name, ok=True)
            except Exception as e:
                log_event("tool_error", level=logging.ERROR, name=call.function.name, error=str(e))
                result = {"error": str(e)}

    log.warning("agent hit max_steps=%d", 10)
    return "Достигнут лимит шагов"</code></pre>

<p><b>Метрики и агрегация.</b> Собираем статистику для мониторинга:</p>

    def __init__(self):

        self.total_tokens = 0
        self.total_cost = 0.0
        self.tool_calls = defaultdict(int)
        self.errors = defaultdict(int)

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Логируют ключи и PII</b> — api_key, пароли, email клиента. Утечка. Маскируй.</li>
  <li><b>Используют print вместо log</b> — нет уровней, нет времени, нельзя отключить.</li>
  <li><b>Логируют всё на DEBUG</b> — гигабайты файлов. INFO для важного, DEBUG для деталей.</li>
  <li><b>Забывают encoding="utf-8"</b> — на Windows ломается кириллица.</li>
  <li><b>Не настраивают ротацию</b> — файл логов растёт до 100 ГБ.</li>
  <li><b>basicConfig вызывают в каждом модуле</b> — настройки перезаписываются. Только один раз при старте.</li>
  <li><b>Не логируют контекст</b> — «ошибка» без args, url, trace_id. По такому логу ничего не понять.</li>
  <li><b>Используют f-strings в log.info</b> — <code>log.info(f"{x}")</code>. Форматирование происходит всегда, даже если уровень отключен. Правильно: <code>log.info("%s", x)</code>.</li>
  <li><b>Логируют от исключений без traceback</b> — <code>log.error(str(e))</code>. Лучше: <code>log.exception(e)</code> — добавит stack trace.</li>
</ul>

<script type="text/template" id="tpl-async-8">
<h3>Теория</h3>

<p>Стриминг — техника получения данных по частям по мере поступления. В LLM это критично: модель отвечает токенами, а не сразу всем текстом. Без стриминга ты ждёшь 10 секунд, пока сгенерируется полный ответ. Со стримингом — видишь первые слова через 0.3 секунды.</p>

<h4>Зачем стриминг</h4>

<table>
  <thead><tr><th>Сценарий</th><th>Без стриминга</th><th>Со стримингом</th></tr></thead>
  <tbody>
    <tr><td>Ответ LLM на 500 токенов</td><td>8 секунд ожидания</td><td>первое слово за 0.3с</td></tr>
    <tr><td>Чат-интерфейс</td><td>Пусто, потом всё сразу</td><td>Текст появляется по мере генерации</td></tr>
    <tr><td>Большой файл</td><td>Загрузить 1 ГБ в память</td><td>Читать по 8 КБ</td></tr>
    <tr><td>SSE-события</td><td>Не поддерживается</td><td>Естественный формат</td></tr>
  </tbody>
</table>

<p>Для UX стриминг — это разница между «приложение работает» и «приложение зависло».</p>

<h4>Как работает стриминг LLM</h4>

<p>API возвращает не одно большое тело, а поток маленьких чанков. Каждый чанк — кусочек ответа:</p>

<pre><code>data: {"choices":[{"delta":{"content":"При"}}]}
data: {"choices":[{"delta":{"content":"вет"}}]}
data: {"choices":[{"delta":{"content":", "}}]}
data: {"choices":[{"delta":{"content":"как"}}]}
data: {"choices":[{"delta":{"content":" дела"}}]}
data: [DONE]</code></pre>

<p>Собирая <code>delta.content</code> последовательно, получаешь полный ответ. Каждый чанк приходит за миллисекунды, общая задержка — как у обычного запроса, но текст виден сразу.</p>

<h4>Async-стриминг в OpenAI SDK</h4>

<pre><button class="copy-btn">copy</button><code>from openai import AsyncOpenAI
import asyncio

client = AsyncOpenAI()

async def stream_response(prompt: str):
    stream = await client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": prompt}],
        stream=True,
    )

    async for chunk in stream:
        delta = chunk.choices[0].delta.content
        if delta:
            print(delta, end="", flush=True)

asyncio.run(stream_response("Объясни async за 3 предложения"))</code></pre>

<h4>Сборка полного текста</h4>

<p>Часто нужно и стримить, и вернуть полный текст:</p>

<pre><button class="copy-btn">copy</button><code>async def stream_and_collect(prompt: str) -&gt; str:
    buffer = []
    stream = await client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": prompt}],
        stream=True,
    )
    async for chunk in stream:
        delta = chunk.choices[0].delta.content or ""
        buffer.append(delta)
        print(delta, end="", flush=True)          # показываем
    return "".join(buffer)                        # возвращаем</code></pre>

<h4>Стриминг tool calls</h4>

<p>Осложнение: tool_calls приходят чанками, и аргументы склеиваются из множества delta. Модель возвращает сначала имя функции, потом по частям JSON аргументов:</p>

<pre><button class="copy-btn">copy</button><code>async def stream_with_tools(prompt: str):
    stream = await client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": prompt}],
        tools=tools,
        stream=True,
    )

    tool_calls = {}   # id → {name, arguments}

    async for chunk in stream:
        delta = chunk.choices[0].delta

        if delta.content:
            print(delta.content, end="", flush=True)

        if delta.tool_calls:
            for tc in delta.tool_calls:
                if tc.id:                                     # новый tool call
                    tool_calls[tc.id] = {"name": tc.function.name, "arguments": ""}
                if tc.function.arguments:
                    tool_calls[tc.id]["arguments"] += tc.function.arguments

    return tool_calls</code></pre>

<h4>SSE — Server-Sent Events</h4>

<p>Стандартный протокол для стриминга в веб. Простой формат:</p>

<pre><code>data: {"delta": "При"}

data: {"delta": "вет"}

data: {"delta": "!"}

data: [DONE]</code></pre>

<p>Каждое сообщение начинается с <code>data: </code>, заканчивается двумя переводами строк. На клиенте — EventSource или fetch с ReadableStream.</p>

<h4>Стриминг в FastAPI</h4>

<pre><button class="copy-btn">copy</button><code>from fastapi import FastAPI
from fastapi.responses import StreamingResponse

app = FastAPI()

async def generate(prompt: str):
    stream = await client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": prompt}],
        stream=True,
    )
    async for chunk in stream:
        delta = chunk.choices[0].delta.content or ""
        if delta:
            yield f"data: {json.dumps({'delta': delta})}\n\n"
    yield "data: [DONE]\n\n"

@app.get("/chat")
async def chat(q: str):
    return StreamingResponse(generate(q), media_type="text/event-stream")</code></pre>

<h4>Стриминг httpx — большой файл</h4>

<p>Не для LLM, но для загрузки файлов:</p>

<pre><button class="copy-btn">copy</button><code>import httpx

async def download(url: str, path: str):
    async with httpx.AsyncClient() as c:
        async with c.stream("GET", url) as r:
            r.raise_for_status()
            with open(path, "wb") as f:
                async for chunk in r.aiter_bytes(chunk_size=8192):
                    f.write(chunk)</code></pre>

<h4>Синхронный стриминг</h4>

<p>Если async не нужен — просто <code>for</code> вместо <code>async for</code>:</p>

<pre><button class="copy-btn">copy</button><code>from openai import OpenAI
client = OpenAI()

stream = client.chat.completions.create(
    model="gpt-4o-mini",
    messages=[{"role": "user", "content": "Привет"}],
    stream=True,
)
for chunk in stream:
    delta = chunk.choices[0].delta.content or ""
    print(delta, end="", flush=True)</code></pre>

<h3>Пошаговый разбор</h3>

<div class="step" data-step="1"><h4>stream=True</h4><p>Параметр в create. Запрос возвращает итератор чанков, а не полный ответ.</p></div>
<div class="step" data-step="2"><h4>async for / for</h4><p>Проходим по чанкам. Каждый чанк содержит delta.content (или tool_calls).</p></div>
<div class="step" data-step="3"><h4>Проверить delta</h4><p>Может быть None (первый чанк с role, последний с finish_reason). Только <code>if delta:</code>.</p></div>
<div class="step" data-step="4"><h4>Печатать/накапливать</h4><p><code>print(delta, end="", flush=True)</code> для CLI. <code>buffer.append(delta)</code> для возврата.</p></div>
<div class="step" data-step="5"><h4>Обработка завершения</h4><p>Когда stream исчерпан — данные закончились. Для tool calls — склеить из чанков.</p></div>

<pre><button class="copy-btn">copy</button><code>import asyncio
from openai import AsyncOpenAI
import json

client = AsyncOpenAI()

# === БАЗОВЫЙ СТРИМИНГ ===
async def stream_basic(prompt: str):
    stream = await client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": prompt}],
        stream=True,
    )
    async for chunk in stream:
        delta = chunk.choices[0].delta.content or ""
        if delta:
            print(delta, end="", flush=True)
    print()  # перевод строки в конце

# === СБОРКА В БУФЕР ===
async def stream_collect(prompt: str) -&gt; dict:
    buffer = []
    tokens_in = 0
    tokens_out = 0

    stream = await client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": prompt}],
        stream=True,
    )
    async for chunk in stream:
        delta = chunk.choices[0].delta.content or ""
        if delta:
            buffer.append(delta)
            print(delta, end="", flush=True)

        if chunk.usage:
            tokens_in = chunk.usage.prompt_tokens
            tokens_out = chunk.usage.completion_tokens

    return {
        "content": "".join(buffer),
        "tokens_in": tokens_in,
        "tokens_out": tokens_out,
    }

# === СТРИМИНГ С TOOL CALLS ===
async def stream_tools(prompt: str):
    tools = [{
        "type": "function",
        "function": {
            "name": "get_weather",
            "description": "Погода",
            "parameters": {
                "type": "object",
                "properties": {"city": {"type": "string"}},
                "required": ["city"],
            },
        },
    }]

    stream = await client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": prompt}],
        tools=tools,
        stream=True,
    )

    tool_calls = {}

    async for chunk in stream:
        delta = chunk.choices[0].delta

        if delta.content:
            print(delta.content, end="", flush=True)

        if delta.tool_calls:
            for tc in delta.tool_calls:
                if tc.id:
                    tool_calls[tc.id] = {"name": tc.function.name, "arguments": ""}
                if tc.function.arguments:
                    tool_calls[tc.id]["arguments"] += tc.function.arguments

    return tool_calls

# === ГЕНЕРАТОР ДЛЯ SSE ===
async def sse_generator(prompt: str):
    stream = await client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": prompt}],
        stream=True,
    )
    async for chunk in stream:
        delta = chunk.choices[0].delta.content or ""
        if delta:
            yield f"data: {json.dumps({'delta': delta}, ensure_ascii=False)}\n\n"
    yield "data: [DONE]\n\n"

# === ЗАПУСК ===
async def main():
    print("--- basic stream ---")
    await stream_basic("Расскажи про async в 3 предложениях")

    print("\n--- stream with collect ---")
    result = await stream_collect("Что такое RAG?")
    print(f"\n[total: {result['tokens_in']}+{result['tokens_out']} tokens]")

    print("\n--- stream with tools ---")
    tools = await stream_tools("Какая погода в Москве?")
    print(f"\ntool_calls: {tools}")

    print("\n--- SSE format ---")
    async for event in sse_generator("Привет"):
        print(repr(event))

asyncio.run(main())</code></pre>

<h3>Где это работает в Agentic</h3>

<p><b>Чат-интерфейс с живым ответом.</b> Пользователь видит, как модель «печатает»:</p>

<pre><button class="copy-btn">copy</button><code>class ChatSession:
    def __init__(self, client):
        self.client = client
        self.history = []

    async def ask(self, question: str):
        self.history.append({"role": "user", "content": question})

        stream = await self.client.chat.completions.create(
            model="gpt-4o-mini",
            messages=self.history,
            stream=True,
        )

        full_response = []
        async for chunk in stream:
            delta = chunk.choices[0].delta.content or ""
            if delta:
                full_response.append(delta)
                print(delta, end="", flush=True)

        answer = "".join(full_response)
        self.history.append({"role": "assistant", "content": answer})
        return answer</code></pre>

<p><b>SSE-эндпоинт в FastAPI.</b> Стриминг ответа агента в браузер:</p>

<pre><button class="copy-btn">copy</button><code>from fastapi import FastAPI
from fastapi.responses import StreamingResponse

app = FastAPI()

@app.get("/agent/stream")
async def agent_stream(q: str):
    async def events():
        async for chunk in run_agent_stream(q):
            yield f"data: {json.dumps(chunk, ensure_ascii=False)}\n\n"
        yield "data: [DONE]\n\n"

    return StreamingResponse(events(), media_type="text/event-stream")

async def run_agent_stream(question: str):
    """Стримит не только финальный ответ, но и шаги агента."""
    yield {"type": "start", "question": question}

    stream = await client.chat.completions.create(...)
    async for chunk in stream:
        delta = chunk.choices[0].delta.content or ""
        if delta:
            yield {"type": "token", "content": delta}

    yield {"type": "end"}</code></pre>

<p><b>Стриминг прогресса длинных задач.</b> Не только текст, но и статусы шагов:</p>

<pre><button class="copy-btn">copy</button><code>async def long_task_stream():
    yield {"step": 1, "status": "loading documents"}
    await asyncio.sleep(1)

    yield {"step": 2, "status": "chunking"}
    await asyncio.sleep(1)

    yield {"step": 3, "status": "embedding", "count": 500}
    await asyncio.sleep(2)

    yield {"step": 4, "status": "done"}</code></pre>

<p><b>Параллельный стриминг нескольких моделей.</b> Сравнить ответы GPT и Claude в реальном времени:</p>

<pre><button class="copy-btn">copy</button><code>async def multi_model_stream(prompt: str):
    async def stream_one(model, queue):
        stream = await client.chat.completions.create(
            model=model,
            messages=[{"role": "user", "content": prompt}],
            stream=True,
        )
        async for chunk in stream:
            delta = chunk.choices[0].delta.content or ""
            if delta:
                await queue.put({"model": model, "delta": delta})
        await queue.put({"model": model, "done": True})

    queue = asyncio.Queue()
    tasks = [
        asyncio.create_task(stream_one("gpt-4o-mini", queue)),
        asyncio.create_task(stream_one("gpt-4o", queue)),
    ]

    done_count = 0
    while done_count &lt; 2:
        event = await queue.get()
        if event.get("done"):
            done_count += 1
        else:
            print(f"[{event['model']}] {event['delta']}")

    await asyncio.gather(*tasks)</code></pre>

<p><b>Отмена стриминга.</b> Пользователь нажал «стоп» — прекращаем:</p>

<pre><button class="copy-btn">copy</button><code>async def cancellable_stream(prompt: str, cancel_event: asyncio.Event):
    stream = await client.chat.completions.create(..., stream=True)
    async for chunk in stream:
        if cancel_event.is_set():
            await stream.close()
            break
        delta = chunk.choices[0].delta.content or ""
        if delta:
            yield delta</code></pre>

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Забывают проверить delta на None</b> — <code>delta.content</code> может быть None (первый чанк role, последний finish). Используй <code>or ""</code>.</li>
  <li><b>Не делают flush</b> — текст копится в буфере и выводится большими кусками. <code>print(..., flush=True)</code>.</li>
  <li><b>Забывают собирать буфер</b> — стримят, но полный ответ не сохраняют. Если нужен результат — accum.</li>
  <li><b>Не обрабатывают tool_calls</b> — думают, что при стриминге их не бывает. Приходят по частям, надо склеивать.</li>
  <li><b>Забывают [DONE]</b> — в SSE-протоколе нужен маркер конца. Иначе клиент не знает, что поток закончился.</li>
  <li><b>Стримят в sync-функции без async</b> — забывают про <code>async for</code>. Синхронный for даст ошибку.</li>
  <li><b>Не обрабатывают разрыв соединения</b> — сеть упала, стрим прервался, но try/except нет.</li>
  <li><b>Отправляют весь буфер после стрима</b> — двойной вывод. Стриминг для UX, буфер для дальнейшей обработки.</li>
</ul>
</div>

<script type="text/template" id="tpl-async-9">
<h3>Теория</h3>

<p>Таймауты и отмена — то, что отличает надёжную систему от хрупкой. Один зависший вызов LLM API может остановить весь агент навсегда. Один бесконечный цикл — исчерпать ресурсы. Защита от этого — обязательный элемент продакшн-агента.</p>

<h4>Зачем таймауты</h4>

<table>
  <thead><tr><th>Проблема</th><th>Что бывает без таймаута</th></tr></thead>
  <tbody>
    <tr><td>API не отвечает</td><td>Запрос висит бесконечно</td></tr>
    <tr><td>Медленная сеть</td><td>Пользователь ждёт 5 минут</td></tr>
    <tr><td>Tool завис</td><td>Агент не завершает шаг</td></tr>
    <tr><td>Бесконечный цикл</td><td>CPU 100%, деньги сгорают</td></tr>
    <tr><td>Гонка задач</td><td>Одна задача ждёт другую, обе висят</td></tr>
  </tbody>
</table>

<p>Правило: <b>любая внешняя операция должна иметь таймаут</b>. Без исключений.</p>

<h4>asyncio.wait_for</h4>

<p>Оборачивает корутину, прерывает её через N секунд:</p>

<pre><button class="copy-btn">copy</button><code>import asyncio

async def slow_operation():
    await asyncio.sleep(10)
    return "done"

async def main():
    try:
        result = await asyncio.wait_for(slow_operation(), timeout=2.0)
        print(result)
    except asyncio.TimeoutError:
        print("превышен таймаут")

asyncio.run(main())
# через 2 секунды: превышен таймаут</code></pre>

<h4>Таймаут на несколько задач сразу</h4>

<p><code>wait_for</code> работает на одну корутину. Для группы — оборачивай весь gather:</p>

<pre><button class="copy-btn">copy</button><code>async def main():
    try:
        results = await asyncio.wait_for(
            asyncio.gather(
                task("A", 1),
                task("B", 2),
                task("C", 5),      # не успеет
            ),
            timeout=3.0,
        )
    except asyncio.TimeoutError:
        print("gather не успел за 3 секунды")
        # Все задачи автоматически отменены</code></pre>

<h4>Таймауты httpx</h4>

<p>На уровне HTTP — свои таймауты, детальнее:</p>

<pre><button class="copy-btn">copy</button><code>import httpx

timeout = httpx.Timeout(
    connect=5.0,       # подключение
    read=30.0,         # чтение ответа
    write=10.0,        # отправка тела
    pool=5.0,          # ожидание свободного соединения
)

async with httpx.AsyncClient(timeout=timeout) as c:
    r = await c.get(url)</code></pre>

<p>Что происходит при превышении: httpx бросает <code>httpx.ReadTimeout</code>, <code>httpx.ConnectTimeout</code> — подтипы <code>httpx.TimeoutException</code>.</p>

<h4>CancelledError — отмена задач</h4>

<p>Task можно отменить через <code>task.cancel()</code>. Внутри корутины поднимется <code>CancelledError</code> — это сигнал «остановись»:</p>

<pre><button class="copy-btn">copy</button><code>async def long_job():
    try:
        await asyncio.sleep(10)
        return "finished"
    except asyncio.CancelledError:
        print("задача отменена, прибираю ресурсы")
        raise                                 # важно: пробрасываем дальше

async def main():
    task = asyncio.create_task(long_job())
    await asyncio.sleep(1)
    task.cancel()                             # отменяем

    try:
        await task
    except asyncio.CancelledError:
        print("подтверждена отмена")

asyncio.run(main())</code></pre>

<div class="warnbox"><b>Никогда не глотай CancelledError.</b> <code>except CancelledError: pass</code> — плохо. Если нужно прибрать ресурсы, сделай это и обязательно <code>raise</code>.</div>

<h4>TaskGroup — автоматическая отмена</h4>

<p>Ключевое преимущество TaskGroup (Python 3.11+): если одна задача падает, остальные <b>автоматически отменяются</b>. Никаких висящих задач.</p>

<pre><button class="copy-btn">copy</button><code>async def might_fail(name, delay, fail=False):
    try:
        await asyncio.sleep(delay)
        if fail:
            raise RuntimeError(f"{name} failed")
        return f"{name} ok"

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Не ставят таймауты вообще</b> — программа зависает навсегда при сбое сети. Всегда.</li>
  <li><b>Ставят таймаут слишком маленький</b> — LLM с 5-секундным таймаутом будет постоянно падать. 30–60 для LLM.</li>
  <li><b>Глотают CancelledError</b> — <code>except CancelledError: pass</code>. Задача не отменяется, ресурсы утекают. Всегда <code>raise</code>.</li>
  <li><b>Не обрабатывают TimeoutError в gather</b> — весь gather падает. Оборачивай каждую задачу отдельно.</li>
  <li><b>Ставят таймаут только на HTTP</b> — забывают про LLM-вызовы, инструменты, wait_for везде.</li>
  <li><b>Не логируют таймауты</b> — не понимаешь, где тормозит. INFO при каждом таймауте.</li>
  <li><b>Забывают про общий таймаут агента</b> — 10 шагов по 30 секунд = 5 минут максимум. Общий лимит обязателен.</li>
  <li><b>Используют <code>asyncio.wait_for</code> для sync-кода</b> — не сработает. Только для корутин.</li>
</ul>
</div>

<h3>Теория</h3>

<p>Async в агентах — не украшение, а необходимость. Агент делает десятки вызовов: LLM, инструменты, база, поиск. Понимание паттернов асинхронной работы отличает работающий прототип от продакшн-системы.</p>

<h4>Паттерн 1: Fan-out / Fan-in</h4>

<p>Самый частый паттерн. Разбить задачу на N независимых подзадач, запустить параллельно, собрать результаты:</p>

<pre><button class="copy-btn">copy</button><code>async def fan_out_fan_in(items: list, processor):
    """Каждый элемент обрабатывается независимо."""
    tasks = [processor(item) for item in items]
    results = await asyncio.gather(*tasks, return_exceptions=True)
    return results</code></pre>

<p>Применения в Agentic:</p>
<ul>
  <li>Классификация 100 текстов через LLM</li>
  <li>Параллельный поиск в 5 источниках (vector, BM25, web, DB, cache)</li>
  <li>Одновременная проверка 3 моделей — взять лучший ответ</li>
  <li>Загрузка 20 документов для RAG</li>
</ul>

<h4>Паттерн 2: Semaphore — ограничение параллелизма</h4>

<p>Fan-out без ограничений опасен: 1000 задач сразу → rate limit, крэш, таймауты. <code>Semaphore(N)</code> пропускает не больше N одновременно:</p>

<pre><button class="copy-btn">copy</button><code>async def limited_fan_out(items: list, processor, concurrency: int = 5):

    async def process_one(item):

    return await asyncio.gather(*[process_one(i) for i in items])</code></pre>

<p>OpenAI даёт 500 RPM и 200k TPM на базовом тарифе. Без semaphore ты быстро упрёшься в лимит.</p>

<h4>Паттерн 3: Producer / Consumer через Queue</h4>

<p>Один источник производит данные, несколько воркеров обрабатывают:</p>

<pre><button class="copy-btn">copy</button><code>async def producer_consumer(items: list, num_workers: int = 3):
    queue = asyncio.Queue()

    async def producer():

<h4>Паттерн 4: Retry с backoff</h4>

<p>Сетевые сбои временны. Retry с экспоненциальной задержкой + jitter:</p>

<pre><button class="copy-btn">copy</button><code>async def retry_with_backoff(fn, attempts=4, base=0.5, retryable=(TimeoutError, ConnectionError)):
    import random

    for i in range(attempts):
        try:
            return await fn()
        except retryable as e:
            if i == attempts - 1:

            delay = base * (2 ** i) + random.random() * 0.1   # jitter

<p>Jitter — случайная добавка. Без неё все клиенты повторяют одновременно и добивают сервер.</p>

<h4>Паттерн 5: Circuit Breaker</h4>

<p>Если сервис лежит — не долби его. Считаем ошибки, при превышении порога «размыкаем цепь» на N секунд:</p>

<pre><button class="copy-btn">copy</button><code>class CircuitBreaker:
    def __init__(self, failure_threshold=5, cooldown=30):
        self.failures = 0
        self.threshold = failure_threshold
        self.cooldown = cooldown
        self.opened_at = 0

    def is_open(self):
        if self.failures < self.threshold:
            return False
        if time.time() - self.opened_at > self.cooldown:
            self.failures = 0        # half-open: пробуем снова
            return False
        return True

    async def call(self, fn):
        if self.is_open():
            raise RuntimeError("circuit breaker open")
        try:
            result = await fn()
            self.failures = 0
            return result
        except Exception:
            self.failures += 1
            if self.failures >= self.threshold:
                self.opened_at = time.time()
            raise</code></pre>

<h4>Паттерн 8: Race — первый успешный</h4>

<p>Запустить несколько источников, взять первый ответивший:</p>

<pre><button class="copy-btn">copy</button><code>async def race(*coros):

<div class="step" data-step="1"><h4>Fan-out вместо последовательности</h4><p>Независимые вызовы — параллельно. Один gather вместо цикла.</p></div>

<div class="step" data-step="5"><h4>Circuit breaker</h4><p>Если сервис стабильно лежит — не тратить деньги и время. Разомкнуть цепь.</p></div>

    async def one(url):

        for _ in range(workers):

            item = await queue.get()
            if item is None:
                break
            result = await process_item(item)
            results.append(result)

    await asyncio.gather(producer(), *[worker() for _ in range(workers)])
    return results

# === RETRY WITH BACKOFF ===
async def retry_call(fn, attempts=4, base=0.5):
    for i in range(attempts):
        try:
            return await fn()
        except (TimeoutError, ConnectionError) as e:
            if i == attempts - 1:
                raise
            delay = base * (2 ** i) + random.random() * 0.1
            print(f"retry in {delay:.2f}s: {e}")
            await asyncio.sleep(delay)

# === RACE ===
async def race(*coros):
    tasks = [asyncio.create_task(c) for c in coros]
    done, pending = await asyncio.wait(tasks, return_when=asyncio.FIRST_COMPLETED)
    for t in pending:
        t.cancel()
    return done.pop().result()

# === BATCH ===
async def batch_process(items: list, batch_size: int = 5):
    results = []
    for i in range(0, len(items), batch_size):
        batch = items[i:i+batch_size]
        batch_results = await asyncio.gather(*[process_item(x) for x in batch])
        results.extend(batch_results)
    return results

# === COMBINED ===
async def robust(items: list, concurrency=3, timeout=5, retries=2):
    sem = asyncio.Semaphore(concurrency)

    async def process(item):
        async with sem:
            for attempt in range(retries):
                try:
                    return await asyncio.wait_for(process_item(item), timeout=timeout)
                except asyncio.TimeoutError:
                    if attempt == retries - 1:
                        return {"error": "timeout", "item": item}
                    await asyncio.sleep(2 ** attempt)

    return await asyncio.gather(*[process(i) for i in items])

# === ЗАПУСК ===
async def main():
    print("=== fan-out ===")
    results = await fan_out([
        "https://httpbin.org/get",
        "https://httpbin.org/uuid",
        "https://httpbin.org/ip",
    ])
    print(results)

    print("\n=== semaphore ===")
    results = await limited_fetch(["https://httpbin.org/get"] * 10, concurrency=3)
    print(f"got {len(results)} results")

    print("\n=== producer/consumer ===")
    results = await producer_consumer(list(range(10)), workers=3)
    print(f"processed {len(results)} items")

    print("\n=== race ===")
    async def fast(): await asyncio.sleep(0.1); return "fast"
    async def slow(): await asyncio.sleep(2); return "slow"
    result = await race(fast(), slow())
    print(result)   # fast

    print("\n=== combined ===")
    results = await robust(list(range(10)), concurrency=3, timeout=2, retries=2)
    print(f"processed {len(results)} items")

asyncio.run(main())</code></pre>

<h3>Где это работает в Agentic</h3>

<p><b>Параллельные инструменты с ограничением.</b> Модель запросила 10 инструментов — не больше 3 одновременно:</p>

<pre><button class="copy-btn">copy</button><code>async def execute_tools(tool_calls: list, registry: dict, concurrency: int = 3):
    sem = asyncio.Semaphore(concurrency)

<pre><button class="copy-btn">copy</button><code>async def classify_batch(texts: list, client, concurrency: int = 5):
