<h4>Агент с двумя инструментами — эталон</h4>
<pre><button class="copy-btn">copy</button><code>import json
from openai import OpenAI

client = OpenAI()

def get_weather(city):
    return {"city": city, "temp": 18}

def calculator(a, b, op):
    ops = {"+": a+b, "-": a-b, "*": a*b, "/": a/b if b else None}
    return {"result": ops.get(op)}

REGISTRY = {"get_weather": get_weather, "calculator": calculator}

TOOLS = [
    {
        "type": "function",
        "function": {
            "name": "get_weather",
            "description": "Возвращает погоду.",
            "parameters": {
                "type": "object",
                "properties": {"city": {"type": "string"}},
                "required": ["city"],
            },
        },
    },
    {
        "type": "function",
        "function": {
            "name": "calculator",
            "description": "Арифметика.",
            "parameters": {
                "type": "object",
                "properties": {
                    "a": {"type": "number"},
                    "b": {"type": "number"},
                    "op": {"type": "string", "enum": ["+", "-", "*", "/"]},
                },
                "required": ["a", "b", "op"],
            },
        },
    },
]

def run(question, max_steps=5):
    messages = [{"role": "user", "content": question}]

    for _ in range(max_steps):
        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=messages,
            tools=TOOLS,
        )
        msg = response.choices[0].message

        if not msg.tool_calls:
            return msg.content

        messages.append(msg)
        for call in msg.tool_calls:
            fn = REGISTRY.get(call.function.name)
            args = json.loads(call.function.arguments)
            result = fn(**args) if fn else {"error": "unknown"}
            messages.append({
                "role": "tool",
                "tool_call_id": call.id,
                "content": json.dumps(result),
            })

    return "Max steps"

print(run("Сколько 12 * 7 и какая погода в Москве?"))</code></pre>

<h4>Retry с backoff — эталон</h4>
<pre><button class="copy-btn">copy</button><code>import asyncio
import random

async def retry_async(fn, *args, attempts=4, base=0.5, **kwargs):
    for i in range(attempts):
        try:
            return await fn(*args, **kwargs)
        except (TimeoutError, ConnectionError) as e:
            if i == attempts - 1:
                raise
            delay = base * (2 ** i) + random.random() * 0.1
            await asyncio.sleep(delay)</code></pre>

<h4>RAG pipeline — эталон</h4>
<pre><button class="copy-btn">copy</button><code>from langchain_text_splitters import RecursiveCharacterTextSplitter
from langchain_openai import OpenAIEmbeddings
from langchain_community.vectorstores import Chroma

def rag_pipeline(documents, query):
    # 1. Chunk
    splitter = RecursiveCharacterTextSplitter(chunk_size=500, chunk_overlap=50)
    chunks = splitter.split_text("\n".join(documents))

    # 2. Embed + store
    emb = OpenAIEmbeddings(model="text-embedding-3-small")
    store = Chroma.from_texts(chunks, emb)

    # 3. Retrieve
    docs = store.similarity_search(query, k=3)

    # 4. Generate
    context = "\n\n".join(d.page_content for d in docs)
    response = client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[
            {"role": "system", "content": "Отвечай на основе контекста."},
            {"role": "user", "content": f"Контекст:\n{context}\n\nВопрос: {query}"},
        ],
    )
    return response.choices[0].message.content</code></pre>

<p>Не все вакансии одинаковы. Некоторые — красные флаги. Умение распознать плохую вакансию сэкономит недели.</p>

<h4>Красные флаги в вакансии</h4>
<ul>
  <li><b>«Нужно знать всё»</b> — от ML до DevOps до фронтенда</li>
  <li><b>Нет стека</b> — «AI-разработчик» без конкретики</li>
  <li><b>«Революционный продукт»</b> без деталей</li>
  <li><b>Нет команды ML/AI</b> — ты будешь один</li>
  <li><b>5+ лет опыта в технологии 2 лет</b> — нереалистичные ожидания</li>
  <li><b>«Работа в режиме стартапа»</b> — 12 часов в день</li>
  <li><b>Много «хотелось бы»</b> и мало «обязательно»</li>
  <li><b>Зарплата «по результатам интервью»</b> — может быть в 3 раза ниже</li>
  <li><b>Нет информации о продукте</b> — непонятно, чем занимается</li>
</ul>

<h4>Красные флаги на интервью</h4>
<ul>
  <li><b>Интервьюер опаздывает</b> на 15+ минут без предупреждения</li>
  <li><b>Не отвечают на твои вопросы</b> — игнорируют</li>
  <li><b>Не помнят твоё имя</b> — не читали резюме</li>
  <li><b>Говорят про «переработки»</b> как норму</li>
  <li><b>Нет технических людей</b> на техническом интервью</li>
  <li><b>«Мы ищем универсала»</b> — расплывчато</li>
  <li><b>Не готовы обсуждать зарплату</b> до финала</li>
</ul>

<h4>Вопросы, которые стоит задать</h4>
<ul>
  <li>Какой стек и почему выбрали именно его?</li>
  <li>Как измеряете качество агента? Есть evals?</li>
  <li>Какая инфраструктура для трейсинга?</li>
  <li>Сколько людей в команде, какие роли?</li>
  <li>Как выглядит типичный рабочий день?</li>
  <li>Есть ли бюджет на эксперименты с моделями?</li>
  <li>Как проходит code review?</li>
  <li>Куда движется продукт через год?</li>
  <li>Почему открыта эта позиция?</li>
  <li>Что случится, если я не справлюсь за 3 месяца?</li>
</ul>

<h4>Зелёные флаги</h4>
<ul>
  <li>Конкретный стек: Python, LangGraph, RAG</li>
  <li>Упоминают evals и метрики</li>
  <li>Есть команда ML/AI с ролями</li>
  <li>Указан диапазон зарплаты</li>
  <li>Описан продукт или задача</li>
  <li>Интервьюеры подготовлены</li>
  <li>Отвечают на твои вопросы</li>
  <li>Рассказывают о сложностях честно</li>
</ul>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Читай вакансию внимательно</h4><p>Что конкретно требуется. Что размыто.</p></div>
<div class="step" data-step="2"><h4>Проверь компанию</h4><p>Сайт, LinkedIn, отзывы, продукт.</p></div>
<div class="step" data-step="3"><h4>На скрининге — уточняй</h4><p>Стек, команда, процессы, зарплата.</p></div>
<div class="step" data-step="4"><h4>На интервью — слушай</h4><p>Как отвечают на твои вопросы.</p></div>
<div class="step" data-step="5"><h4>После — оцени</h4><p>Что смутило, что понравилось. Сравни с другими.</p></div>

<h3>Что делать при красных флагах</h3>
<ul>
  <li><b>Много мелких</b> — вежливо откажись. Время дороже.</li>
  <li><b>Один крупный</b> — уточни. Может, недоразумение.</li>
  <li><b>Не уверен</b> — задай вопросы. Хорошие ответы снимут сомнения.</li>
  <li><b>Уверен</b> — не трать время на дальнейшие этапы.</li>
</ul>

<p><b>Разбор:</b> Слишком широкий спектр. Не указан уровень. Нет конкретики продукта. Ожидания от senior с 5+ опытом, но не указан бюджет. Красный флаг.</p>

const tabsEl = document.getElementById('tabs');
const sidebarTitle = document.getElementById('sidebar-title');
const courseList = document.getElementById('course-list');
const content = document.getElementById('content');

let currentTab = localStorage.getItem('rocket_tab') || 'python';
let currentCourse = 0;
let doneCourses = {};
try { doneCourses = JSON.parse(localStorage.getItem('rocket_done') || '{}'); } catch(e){ doneCourses = {}; }

function shortTitle(t){
  const p = String(t).split('. ');
  return p.length > 1 ? p.slice(1).join('. ') : t;
}

function getBody(bodyId){
  const el = document.getElementById(bodyId);
  if(!el) return '<p>Курс в разработке.</p>';
  return el.innerHTML;
}

function updateSidebar(tabKey){
  const courses = COURSES[tabKey];
  const tabEl = tabsEl.querySelector('[data-tab="' + tabKey + '"]');
  sidebarTitle.textContent = 'Курсы · ' + (tabEl ? tabEl.textContent : tabKey);
  courseList.innerHTML = '';
  courses.forEach(function(c, i){
    const li = document.createElement('li');
    li.className = 'course-item';
    const key = tabKey + ':' + i;
    if(doneCourses[key]) li.classList.add('done');
    if(i === currentCourse) li.classList.add('active');
    const nSpan = document.createElement('span');
    nSpan.className = 'n';
    nSpan.textContent = String(i + 1);
    const tSpan = document.createElement('span');
    tSpan.textContent = shortTitle(c.title);
    li.appendChild(nSpan);
    li.appendChild(tSpan);
    li.addEventListener('click', function(){
      currentCourse = i;
      updateSidebar(tabKey);
      renderCourse();
      closeMobileMenu(); 
    });
    courseList.appendChild(li);
  });
}

function renderCourse(){
  const courses = COURSES[currentTab];
  const c = courses[currentCourse];
  const tabEl = tabsEl.querySelector('[data-tab="' + currentTab + '"]');
  const tabName = tabEl ? tabEl.textContent : currentTab;
  const headerHtml = '<h2>'
    + '<span class="badge-num">' + (currentCourse + 1) + '</span>'
    + shortTitle(c.title) + '</h2>'
    + '<p class="sub">' + c.sub + ' · ' + tabName + '</p>';
  const isDone = !!doneCourses[currentTab + ':' + currentCourse];
  const doneLabel = isDone ? '✓ Изучено' : 'Отметить изученным';
  const doneClass = isDone ? 'done-btn is-done' : 'done-btn';
  const pagerHtml = '<div class="pager">'
    + '<button id="prevBtn"' + (currentCourse === 0 ? ' disabled' : '') + '>← Предыдущий</button>'
    + '<button id="doneBtn" class="' + doneClass + '">' + doneLabel + '</button>'
    + '<button id="nextBtn"' + (currentCourse === courses.length - 1 ? ' disabled' : '') + '>Следующий →</button>'
    + '</div>';
  content.innerHTML = headerHtml + getBody(c.bodyId) + pagerHtml;
  attachCopyButtons();
  attachCheckboxes();
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const doneBtn = document.getElementById('doneBtn');
  if(prevBtn) prevBtn.addEventListener('click', function(){
    if(currentCourse > 0){ currentCourse--; updateSidebar(currentTab); renderCourse(); window.scrollTo({top:0,behavior:'smooth'}); }
  });
  if(nextBtn) nextBtn.addEventListener('click', function(){
    if(currentCourse < courses.length - 1){ currentCourse++; updateSidebar(currentTab); renderCourse(); window.scrollTo({top:0,behavior:'smooth'}); }
  });
  if(doneBtn) doneBtn.addEventListener('click', function(){
    const key = currentTab + ':' + currentCourse;
    doneCourses[key] = !doneCourses[key];
    localStorage.setItem('rocket_done', JSON.stringify(doneCourses));
    updateSidebar(currentTab);
    renderCourse();
  });
}

function attachCopyButtons(){
  content.querySelectorAll('.copy-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const pre = btn.parentElement;
      const codeEl = pre ? pre.querySelector('code') : null;
      if(!codeEl) return;
      const text = codeEl.innerText;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          btn.textContent = '✓';
          setTimeout(function(){ btn.textContent = 'copy'; }, 1200);
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch(e){}
        document.body.removeChild(ta);
        btn.textContent = '✓';
        setTimeout(function(){ btn.textContent = 'copy'; }, 1200);
      }
    });
  });
}

function attachCheckboxes(){
  content.querySelectorAll('.check li').forEach(function(li, i){
    const key = 'chk_' + currentTab + '_' + currentCourse + '_' + i;
    if(localStorage.getItem(key) === '1') li.dataset.done = '1';
    li.addEventListener('click', function(){
      const d = li.dataset.done === '1';
      li.dataset.done = d ? '0' : '1';
      localStorage.setItem(key, d ? '0' : '1');
    });
  });
}

tabsEl.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    tabsEl.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    currentTab = t.dataset.tab;
    currentCourse = 0;
    localStorage.setItem('rocket_tab', currentTab);
    updateSidebar(currentTab);
    renderCourse();
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

if(!COURSES[currentTab]) currentTab = 'python';
tabsEl.querySelectorAll('.tab').forEach(function(t){
  if(t.dataset.tab === currentTab) t.classList.add('active');
  else t.classList.remove('active');
});
updateSidebar(currentTab);
renderCourse();
  
// ===== МОБИЛЬНОЕ МЕНЮ =====
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

function openMobileMenu(){
  sidebar.classList.add('open');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeMobileMenu(){
  sidebar.classList.remove('open');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

if(menuBtn){
  menuBtn.addEventListener('click', function(){
    if(sidebar.classList.contains('open')){ closeMobileMenu(); }
    else { openMobileMenu(); }
  });
}
if(overlay){ overlay.addEventListener('click', closeMobileMenu); }
tabsEl.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', closeMobileMenu);
});

// ===== SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.log('SW registration failed:', err);
    });
  });
}
</script>
