<p><b>Стриминг прогресса через Queue.</b> Агент работает — UI видит шаги в реальном времени:</p>

<pre><button class="copy-btn">copy</button><code>async def run_agent_streaming(question: str, event_queue: asyncio.Queue):
    await event_queue.put({"type": "start"})

    messages = [{"role": "user", "content": question}]

    for step in range(10):
        await event_queue.put({"type": "step", "step": step})

        response = await llm.chat(messages)
        await event_queue.put({"type": "llm_response", "content": response.content})

        if not response.tool_calls:
            await event_queue.put({"type": "done", "answer": response.content})
            return

        for call in response.tool_calls:
            await event_queue.put({"type": "tool_call", "name": call.function.name})
            result = await execute_tool(call)
            await event_queue.put({"type": "tool_result", "name": call.function.name})

    await event_queue.put({"type": "max_steps"})</code></pre>

<h3>Типичные ошибки</h3>

<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Последовательный цикл вместо fan-out</b> — <code>for url in urls: await fetch(url)</code>. Медленно. Используй gather.</li>
  <li><b>Fan-out без semaphore</b> — 1000 задач сразу → rate limit. Ограничивай.</li>
  <li><b>Не обрабатывают ошибки в gather</b> — одна упавшая убивает всё. <code>return_exceptions=True</code>.</li>
  <li><b>Retry без jitter</b> — все клиенты повторяют одновременно. Добавь random.</li>
  <li><b>Retry для non-retryable</b> — 400-е ошибки повторяют 3 раза. Различай.</li>
  <li><b>Нет таймаутов</b> — один зависший вызов держит весь gather. wait_for на каждый.</li>
  <li><b>Не закрывают Task'и</b> — TaskGroup или явный cancel. Иначе Task was destroyed warning.</li>
  <li><b>Используют sleep для синхронизации</b> — race condition. Только Queue/Event/Lock.</li>
</ul>
</div>

<h3>Теория</h3>
<p>LLM (Large Language Model) — нейросеть, обученная предсказывать следующий токен. Ты даёшь ей последовательность токенов, она возвращает наиболее вероятное продолжение. API современных LLM построен вокруг одной абстракции: <b>chat completions</b>.</p>

<h4>Токены — единица измерения и оплаты</h4>
<p>LLM работает не с буквами, а с токенами — кусочками слов. На английском 1 токен ≈ 0.75 слова, на русском 1 токен ≈ 2-3 символа (кириллица дороже).</p>

<div class="step" data-step="1"><h4>Клиент</h4><p>Один на всё приложение. Хранит API-ключ и таймауты.</p></div>
<div class="step" data-step="2"><h4>Messages</h4><p>Список dict с role и content. Порядок: system → user → assistant → ...</p></div>

<pre><button class="copy-btn">copy</button><code>from openai import OpenAI
import os
import time

client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])

def chat(messages: list, model: str = "gpt-4o-mini", temperature: float = 0.3, max_tokens: int = 500) -> dict:
    t0 = time.perf_counter()

    response = client.chat.completions.create(
        model=model,
        messages=messages,
        temperature=temperature,
        max_tokens=max_tokens,
    )

    latency = time.perf_counter() - t0
    usage = response.usage

    print(f"[llm] model={model} in={usage.prompt_tokens} out={usage.completion_tokens} latency={latency:.2f}s")

    return {
        "content": response.choices[0].message.content,
        "usage": {
            "prompt_tokens": usage.prompt_tokens,
            "completion_tokens": usage.completion_tokens,
            "total_tokens": usage.total_tokens,
        },
        "latency": latency,
    }

# Многошаговый диалог
history = [{"role": "system", "content": "Ты ассистент."}]

def ask(question: str) -> str:
    history.append({"role": "user", "content": question})
    result = chat(history)
    history.append({"role": "assistant", "content": result["content"]})
    return result["content"]

print(ask("Меня зовут Алиса"))
print(ask("Как меня зовут?"))</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Трекинг метрик.</b> Каждый вызов логирует токены и стоимость:</p>

<pre><button class="copy-btn">copy</button><code>class LLMStats:
    def __init__(self):
        self.calls = 0
        self.tokens_in = 0
        self.tokens_out = 0
        self.cost = 0.0

    def track(self, usage, model: str):
        self.calls += 1
        self.tokens_in += usage.prompt_tokens
        self.tokens_out += usage.completion_tokens

        prices = {"gpt-4o-mini": (0.15, 0.60), "gpt-4o": (2.50, 10.00)}
        in_p, out_p = prices.get(model, (0.15, 0.60))
        self.cost += usage.prompt_tokens * in_p / 1_000_000
        self.cost += usage.completion_tokens * out_p / 1_000_000

    def summary(self):
        return {
            "calls": self.calls,
            "tokens_in": self.tokens_in,
            "tokens_out": self.tokens_out,
            "cost_usd": round(self.cost, 6),
        }

stats = LLMStats()

def chat_tracked(messages, model="gpt-4o-mini", **kw):
    resp = client.chat.completions.create(model=model, messages=messages, **kw)
    stats.track(resp.usage, model)
    return resp</code></pre>

<p><b>Обрезка истории.</b> Токены растут линейно — обрезай:</p>

<pre><button class="copy-btn">copy</button><code>def trim_history(messages: list, max_tokens: int = 4000) -> list:
    import tiktoken
    enc = tiktoken.encoding_for_model("gpt-4o-mini")

    system = [m for m in messages if m["role"] == "system"]
    rest = [m for m in messages if m["role"] != "system"]

    total = sum(len(enc.encode(m["content"])) for m in system)
    kept = []

    for m in reversed(rest):
        t = len(enc.encode(m["content"]))
        if total + t > max_tokens:
            break
        kept.insert(0, m)
        total += t

    return system + kept</code></pre>

  <li><b>Не ставят max_tokens</b> — модель отвечает на 4000 токенов, счёт в 10× больше.</li>
  <li><b>Забывают про cost</b> — работает, но $500 в месяц. Логируй токены.</li>
  <li><b>gpt-4o для простых задач</b> — классификация на дорогой модели в 15 раз дороже.</li>
  <li><b>Хардкодят ключ в коде</b> — попадает в git. Только через env.</li>
  <li><b>Вся история при каждом запросе</b> — токены растут линейно. Обрезай.</li>

<pre><button class="copy-btn">copy</button><code>from openai import OpenAI
import os
import time

client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])

def chat(messages, model="gpt-4o-mini", temperature=0.3, max_tokens=500):
    t0 = time.perf_counter()

    response = client.chat.completions.create(
        model=model,
        messages=messages,
        temperature=temperature,
        max_tokens=max_tokens,
    )

    latency = time.perf_counter() - t0
    usage = response.usage

    print(f"[llm] model={model} in={usage.prompt_tokens} out={usage.completion_tokens} latency={latency:.2f}s")

    return {
        "content": response.choices[0].message.content,
        "usage": {
            "prompt_tokens": usage.prompt_tokens,
            "completion_tokens": usage.completion_tokens,
            "total_tokens": usage.total_tokens,
        },
        "latency": latency,
    }

history = [{"role": "system", "content": "Ты ассистент."}]

def ask(question):
    history.append({"role": "user", "content": question})
    result = chat(history)
    history.append({"role": "assistant", "content": result["content"]})
    return result["content"]

print(ask("Меня зовут Алиса"))
print(ask("Как меня зовут?"))</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Трекинг метрик.</b> Каждый вызов логирует токены и стоимость:</p>

<pre><button class="copy-btn">copy</button><code>class LLMStats:
    def __init__(self):
        self.calls = 0
        self.tokens_in = 0
        self.tokens_out = 0
        self.cost = 0.0

    def track(self, usage, model):
        self.calls += 1
        self.tokens_in += usage.prompt_tokens
        self.tokens_out += usage.completion_tokens

        prices = {"gpt-4o-mini": (0.15, 0.60), "gpt-4o": (2.50, 10.00)}
        in_p, out_p = prices.get(model, (0.15, 0.60))
        self.cost += usage.prompt_tokens * in_p / 1000000
        self.cost += usage.completion_tokens * out_p / 1000000

    def summary(self):
        return {
            "calls": self.calls,
            "tokens_in": self.tokens_in,
            "tokens_out": self.tokens_out,
            "cost_usd": round(self.cost, 6),
        }

stats = LLMStats()

def chat_tracked(messages, model="gpt-4o-mini", **kw):
    resp = client.chat.completions.create(model=model, messages=messages, **kw)
    stats.track(resp.usage, model)
    return resp</code></pre>

<p><b>Обрезка истории.</b> Токены растут линейно — обрезай:</p>

<pre><button class="copy-btn">copy</button><code>def trim_history(messages, max_tokens=4000):
    import tiktoken
    enc = tiktoken.encoding_for_model("gpt-4o-mini")

    system = [m for m in messages if m["role"] == "system"]
    rest = [m for m in messages if m["role"] != "system"]

    total = sum(len(enc.encode(m["content"])) for m in system)
    kept = []

    for m in reversed(rest):
        t = len(enc.encode(m["content"]))
        if total + t > max_tokens:
            break
        kept.insert(0, m)
        total += t

    return system + kept</code></pre>

  <li><b>Забывают про cost</b> — работает, но $500 в месяц. Логируй токены.</li>

  <li><b>Хардкодят ключ в коде</b> — попадает в git. Только через env.</li>
  <li><b>Вся история при каждом запросе</b> — токены растут линейно. Обрезай.</li>

<h3>Теория</h3>
<p>Tool calling превращает LLM из генератора текста в агента, способного действовать. Фундамент всех современных AI-агентов.</p>

<h4>Проблема</h4>
<p>LLM не имеет доступа к актуальным данным, твоим данным, действиям. До tool calling было два подхода: fine-tuning (дорого) и prompt engineering с regex-парсингом (хрупко). Tool calling — структурированный протокол.</p>

<h4>Как работает</h4>
<pre><button class="copy-btn">copy</button><code>1. Отправляешь запрос с описанием инструментов (JSON Schema)
2. Модель решает, что нужен инструмент, возвращает:
   {"tool_calls": [{"id": "call_abc", "function": {"name": "get_weather", "arguments": "{\"city\": \"Moscow\"}"}}]}
3. Ты исполняешь get_weather("Moscow")
4. Добавляешь результат в messages с role="tool" и tool_call_id
5. Отправляешь обратно
6. Модель даёт финальный ответ
7. Если нужно — повторяет</code></pre>

<h4>Роли</h4>
<table>
  <thead><tr><th>Роль</th><th>Что содержит</th></tr></thead>
  <tbody>
    <tr><td>system</td><td>Инструкции</td></tr>
    <tr><td>user</td><td>Вопрос</td></tr>
    <tr><td>assistant</td><td>Ответ или tool_calls</td></tr>
    <tr><td>tool</td><td>Результат, привязан по tool_call_id</td></tr>
  </tbody>
</table>

<h4>Формат описания</h4>
<pre><button class="copy-btn">copy</button><code>{
  "type": "function",
  "function": {
    "name": "get_weather",
    "description": "Возвращает погоду в городе.",
    "parameters": {
      "type": "object",
      "properties": {
        "city": {"type": "string", "description": "Город"},
        "units": {"type": "string", "enum": ["celsius", "fahrenheit"]}
      },
      "required": ["city"]
    }
  }
}</code></pre>

<div class="tip"><b>Description критичен.</b> Модель решает по нему, вызывать ли инструмент. Если размытый — не поймёт.</div>

<h4>tool_choice</h4>
<pre><button class="copy-btn">copy</button><code>tool_choice="auto"        # модель решает (по умолчанию)
tool_choice="none"        # не вызывать
tool_choice="required"    # обязательно вызвать
tool_choice={"type": "function", "function": {"name": "get_weather"}}</code></pre>

<h4>Ограничения</h4>
<table>
  <thead><tr><th>Ограничение</th><th>Что делать</th></tr></thead>
  <tbody>
    <tr><td>Не вызывает инструмент</td><td>Улучшить description</td></tr>
    <tr><td>Невалидный JSON args</td><td>Парсить в try/except</td></tr>
    <tr><td>Несуществующий инструмент</td><td>Проверять имя по реестру</td></tr>
    <tr><td>Зацикливание</td><td>max_steps = 5-15</td></tr>
    <tr><td>Растёт стоимость</td><td>Логировать usage</td></tr>
  </tbody>
</table>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Описать инструменты</h4><p>JSON Schema: name, description, parameters.</p></div>
<div class="step" data-step="2"><h4>Отправить с tools</h4><p>Модель видит доступные инструменты.</p></div>
<div class="step" data-step="3"><h4>Проверить tool_calls</h4><p>Если есть — структура вызовов, не текст.</p></div>
<div class="step" data-step="4"><h4>Исполнить</h4><p>Добавить результаты с role="tool".</p></div>
<div class="step" data-step="5"><h4>Повторить</h4><p>Пока не вернёт обычный content. Лимит шагов.</p></div>

<pre><button class="copy-btn">copy</button><code>import json
from openai import OpenAI

client = OpenAI()

def get_weather(city: str) -> dict:
    return {"city": city, "temp_c": 18}

def calculator(a: float, b: float, op: str) -> dict:
    ops = {"+": a+b, "-": a-b, "*": a*b, "/": a/b if b else None}
    return {"result": ops.get(op)}

REGISTRY = {"get_weather": get_weather, "calculator": calculator}

TOOLS = [
    {
        "type": "function",
        "function": {
            "name": "get_weather",
            "description": "Возвращает погоду в городе.",
            "parameters": {
                "type": "object",
                "properties": {"city": {"type": "string"}},
                "required": ["city"],
            },
        },
    },
    {
        "type": "function",
        "function": {
            "name": "calculator",
            "description": "Арифметика. Используй для любых вычислений.",
            "parameters": {
                "type": "object",
                "properties": {
                    "a": {"type": "number"},
                    "b": {"type": "number"},
                    "op": {"type": "string", "enum": ["+", "-", "*", "/"]},
                },
                "required": ["a", "b", "op"],
            },
        },
    },
]

def run(question: str, max_steps: int = 5) -> str:
    messages = [{"role": "user", "content": question}]

    for step in range(max_steps):
        resp = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=messages,
            tools=TOOLS,
        )
        msg = resp.choices[0].message

        if not msg.tool_calls:
            return msg.content

        messages.append(msg)
        for call in msg.tool_calls:
            fn = REGISTRY.get(call.function.name)
            args = json.loads(call.function.arguments)
            result = fn(**args) if fn else {"error": "unknown tool"}
            messages.append({
                "role": "tool",
                "tool_call_id": call.id,
                "content": json.dumps(result),
            })

    return "Max steps"

print(run("Сколько 12 * 7 и какая погода в Москве?"))</code></pre>

<h3>Теория</h3>
<p>В курсе 3 — теория, теперь полный рабочий код. Это минимальный агент: цикл «модель → инструмент → модель», основа LangGraph, CrewAI, AutoGen.</p>

<h4>Архитектура цикла</h4>
<pre><button class="copy-btn">copy</button><code>while not done and step < max_steps:
    1. Отправить messages + tools
    2. Получить ответ
    3. Если нет tool_calls — выход
    4. Иначе: для каждого вызова:
        a. Найти в реестре
        b. Распарсить args
        c. Вызвать с обработкой
        d. Добавить результат с role=tool
    5. step++, повторить</code></pre>

<h4>Компоненты</h4>
<table>
  <thead><tr><th>Компонент</th><th>Роль</th></tr></thead>
  <tbody>
    <tr><td>Реестр</td><td>dict {name: fn}</td></tr>
    <tr><td>Схема</td><td>JSON Schema для модели</td></tr>
    <tr><td>Messages</td><td>История диалога</td></tr>
    <tr><td>Цикл</td><td>for с max_steps</td></tr>
    <tr><td>Safe execute</td><td>Обработка ошибок</td></tr>
  </tbody>
</table>

<h3>Полный код</h3>
<pre><button class="copy-btn">copy</button><code>import json
from openai import OpenAI

client = OpenAI()

# === ИНСТРУМЕНТЫ ===
def get_weather(city: str) -> dict:
    return {"city": city, "temp_c": 18, "condition": "cloudy"}

def calculator(a: float, b: float, op: str) -> dict:
    ops = {"+": a+b, "-": a-b, "*": a*b, "/": a/b if b else None}
    if op not in ops:
        return {"error": f"unknown op: {op}"}
    return {"result": ops[op]}

def search_web(query: str, top_k: int = 3) -> list:
    return [{"title": f"Result {i}", "url": f"http://x/{i}"} for i in range(top_k)]

# === РЕЕСТР ===
REGISTRY = {
    "get_weather": get_weather,
    "calculator": calculator,
    "search_web": search_web,
}

# === СХЕМЫ ===
TOOLS = [
    {
        "type": "function",
        "function": {
            "name": "get_weather",
            "description": "Возвращает погоду в городе.",
            "parameters": {
                "type": "object",
                "properties": {"city": {"type": "string"}},
                "required": ["city"],
            },
        },
    },
    {
        "type": "function",
        "function": {
            "name": "calculator",
            "description": "Выполняет арифметику.",
            "parameters": {
                "type": "object",
                "properties": {
                    "a": {"type": "number"},
                    "b": {"type": "number"},
                    "op": {"type": "string", "enum": ["+", "-", "*", "/"]},
                },
                "required": ["a", "b", "op"],
            },
        },
    },
    {
        "type": "function",
        "function": {
            "name": "search_web",
            "description": "Ищет в интернете.",
            "parameters": {
                "type": "object",
                "properties": {
                    "query": {"type": "string"},
                    "top_k": {"type": "integer", "default": 3},
                },
                "required": ["query"],
            },
        },
    },
]

# === SAFE EXECUTE ===
def safe_execute(name: str, args_str: str) -> str:
    fn = REGISTRY.get(name)
    if fn is None:
        return json.dumps({"error": f"unknown tool: {name}"})

    try:
        args = json.loads(args_str)
    except json.JSONDecodeError as e:
        return json.dumps({"error": f"invalid JSON: {e}"})

    try:
        result = fn(**args)
        return json.dumps(result, ensure_ascii=False)
    except TypeError as e:
        return json.dumps({"error": f"invalid args: {e}"})
    except Exception as e:
        return json.dumps({"error": str(e)})

# === АГЕНТ ===
def run_agent(question: str, max_steps: int = 10, verbose: bool = True) -> str:
    messages = [
        {"role": "system", "content": "Ты ассистент с инструментами."},
        {"role": "user", "content": question},
    ]

    for step in range(max_steps):
        if verbose:
            print(f"\n[step {step + 1}]")

        response = client.chat.completions.create(
            model="gpt-4o-mini",
            messages=messages,
            tools=TOOLS,
            temperature=0.3,
        )

        msg = response.choices[0].message

        if not msg.tool_calls:
            if verbose:
                print(f"[final] {msg.content}")
            return msg.content

        messages.append(msg)

        for call in msg.tool_calls:
            name = call.function.name
            args_str = call.function.arguments

            if verbose:
                print(f"[tool] {name}({args_str})")

            result = safe_execute(name, args_str)

            if verbose:
                print(f"[result] {result[:100]}")

            messages.append({
                "role": "tool",
                "tool_call_id": call.id,
                "content": result,
            })

    return "Достигнут лимит шагов"

# === ЗАПУСК ===
if __name__ == "__main__":
    print(run_agent("Сколько (12 * 7) + 5 / 2?"))
    print("=" * 60)
    print(run_agent("Какая погода в Москве, Питере и Казани?"))
    print("=" * 60)
    print(run_agent("Найди про Python и посчитай 2^10"))</code></pre>

<h4>Защита от зацикливания</h4>
<pre><button class="copy-btn">copy</button><code>def run_agent_safe(question, max_steps=10, max_cost=0.5):
    messages = [{"role": "user", "content": question}]
    total_cost = 0.0
    history = []

    for step in range(max_steps):
        response = client.chat.completions.create(
            model="gpt-4o-mini", messages=messages, tools=TOOLS,
        )
        total_cost += estimate_cost(response.usage)

        if total_cost > max_cost:
            return "Превышен бюджет"

        msg = response.choices[0].message
        if not msg.tool_calls:
            return msg.content

        current = [(c.function.name, c.function.arguments) for c in msg.tool_calls]
        if current in history[-2:]:
            return "Агент зациклился"

        history.append(current)
        messages.append(msg)

        for call in msg.tool_calls:
            result = safe_execute(call.function.name, call.function.arguments)
            messages.append({
                "role": "tool",
                "tool_call_id": call.id,
                "content": result,
            })

    return "Max steps"</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Логирование каждого шага:</b></p>
<pre><button class="copy-btn">copy</button><code>import logging

    for step in range(10):
        response = client.chat.completions.create(
            model="gpt-4o-mini", messages=messages, tools=TOOLS,
        )
        msg = response.choices[0].message
        log.info(f"llm_response tokens_in={response.usage.prompt_tokens} tokens_out={response.usage.completion_tokens}")

        if not msg.tool_calls:
            log.info(f"agent_finished steps={step+1}")
            return msg.content

        messages.append(msg)
        for call in msg.tool_calls:
            log.info(f"tool_call name={call.function.name}")
            result = safe_execute(call.function.name, call.function.arguments)
            messages.append({
                "role": "tool",
                "tool_call_id": call.id,
                "content": result,
            })

    return "Max steps"</code></pre>

<p>Инструменты падают. Всегда. Причины: API недоступен, невалидные аргументы, инструмент не существует, внутренние ошибки, rate limit, авторизация.</p>

<h4>Принцип: ошибка — это данные</h4>
<p>Не пробрасывай исключения наверх. Верни ошибку модели как часть tool-результата. Модель адаптируется.</p>

<pre><button class="copy-btn">copy</button><code># ПЛОХО — падает весь агент
def get_weather(city):
    return requests.get(f"https://api.com/{city}").json()

# ХОРОШО
def get_weather(city):
    try:
        r = requests.get(f"https://api.com/{city}", timeout=5)
        r.raise_for_status()
        return {"temp": r.json()["temp"]}
    except requests.Timeout:
        return {"error": "timeout", "retryable": True}
    except requests.HTTPError as e:
        return {"error": f"http {e.response.status_code}", "retryable": e.response.status_code >= 500}</code></pre>

        args = json.loads(args_json)
    except json.JSONDecodeError as e:
        return {"error": f"invalid JSON: {e}", "retryable": False}

    try:
        result = fn(**args)
        return {"ok": True, "result": result}
    except TypeError as e:
        return {"error": f"invalid arguments: {e}", "retryable": False}
    except TimeoutError:
        return {"error": "timeout", "retryable": True}
    except ConnectionError:
        return {"error": "connection failed", "retryable": True}
    except Exception as e:
        log.exception(f"unexpected error name={name}")
        return {"error": f"{type(e).__name__}: {e}", "retryable": False}</code></pre>

<h4>Retry с backoff</h4>
<pre><button class="copy-btn">copy</button><code>import asyncio, random

async def retry_execute(fn, attempts=3, base_delay=0.5, **kwargs):
    for i in range(attempts):
        try:
            result = await fn(**kwargs)
            if isinstance(result, dict) and result.get("retryable") and i < attempts - 1:
                delay = base_delay * (2 ** i) + random.random() * 0.1
                await asyncio.sleep(delay)
                continue
            return result
        except (TimeoutError, ConnectionError) as e:
            if i == attempts - 1:
                raise
            delay = base_delay * (2 ** i) + random.random() * 0.1
            await asyncio.sleep(delay)</code></pre>

<h4>Circuit breaker</h4>
<pre><button class="copy-btn">copy</button><code>import time

class CircuitBreaker:
    def __init__(self, threshold=5, cooldown=60):
        self.failures = 0
        self.threshold = threshold
        self.cooldown = cooldown
        self.opened_at = 0

    def is_open(self):
        if self.failures < self.threshold:
            return False
        if time.time() - self.opened_at > self.cooldown:
            self.failures = 0
            return False
        return True

    async def call(self, fn, *args, **kwargs):
        if self.is_open():
            return {"error": "circuit breaker open"}
        try:
            result = await fn(*args, **kwargs)
            self.failures = 0
            return result
        except Exception as e:
            self.failures += 1
            if self.failures >= self.threshold:
                self.opened_at = time.time()
            raise</code></pre>

class ToolMetrics:
    def __init__(self):
        self.calls = defaultdict(int)
        self.errors = defaultdict(int)
        self.latency = defaultdict(list)

    def track(self, name, latency, ok):
        self.calls[name] += 1
        self.latency[name].append(latency)
        if not ok:

    def error_rate(self, name):

        return self.errors[name] / self.calls[name]

<h4>Стратегия 2: Token trim</h4>
<pre><button class="copy-btn">copy</button><code>import tiktoken

<p>Evals — тесты для LLM-приложений. Без них ты не знаешь: улучшился ли агент, работает ли на реальных данных, какие краевые случаи ломаются.</p>

<h4>Простейший eval-набор</h4>
<pre><button class="copy-btn">copy</button><code>from dataclasses import dataclass

@dataclass
class Case:
    input: str
    expected: str

CASES = [
    Case("2+2", "4"),
    Case("Столица Франции", "Париж"),
    Case("Сколько дней в неделе", "7"),
]

def run_eval(agent_fn, cases):
    correct = 0
    for case in cases:
        got = agent_fn(case.input)
        ok = case.expected.lower() in got.lower()
        correct += ok
        print(f"[{'OK' if ok else 'FAIL'}] {case.input} → {got}")

    accuracy = correct / len(cases)
    print(f"accuracy: {correct}/{len(cases)} = {accuracy:.1%}")
    return accuracy</code></pre>

<h4>Метрики классификации</h4>
<pre><button class="copy-btn">copy</button><code>def classification_metrics(predictions, expected):
    classes = set(expected) | set(predictions)
    stats = {c: {"tp": 0, "fp": 0, "fn": 0} for c in classes}

    for pred, exp in zip(predictions, expected):
        if pred == exp:
            stats[exp]["tp"] += 1
        else:
            stats[pred]["fp"] += 1
            stats[exp]["fn"] += 1

    metrics = {}
    for c, s in stats.items():
        p = s["tp"] / (s["tp"] + s["fp"]) if (s["tp"] + s["fp"]) > 0 else 0
        r = s["tp"] / (s["tp"] + s["fn"]) if (s["tp"] + s["fn"]) > 0 else 0
        f1 = 2 * p * r / (p + r) if (p + r) > 0 else 0
        metrics[c] = {"precision": p, "recall": r, "f1": f1}

    accuracy = sum(p == e for p, e in zip(predictions, expected)) / len(expected)
    metrics["__accuracy__"] = accuracy
    return metrics</code></pre>

<h4>LLM-as-judge</h4>
<pre><button class="copy-btn">copy</button><code>JUDGE_PROMPT = """Оцени ответ ассистента 0-10.

Получено: {actual}

Критерии: точность, полнота, формат.

Верни JSON: {{"score": 0-10, "reason": "..."}}"""

def judge(question, expected, actual):
    r = client.chat.completions.create(
        model="gpt-4o-mini",
        messages=[{"role": "user", "content": JUDGE_PROMPT.format(question=question, expected=expected, actual=actual)}],
        response_format={"type": "json_object"},

    Case("Цвет неба", "син", "general"),
    Case("Самая высокая гора", "Эверест", "geo"),
    Case("Первый президент США", "Вашингтон", "history"),
    Case("Год основания Python", "1991", "tech"),
]

def simple_agent(question: str) -> str:

        temperature=0,
        max_tokens=50,
    )

def run_eval(agent_fn, cases):
    results = []
    correct = 0
    by_category = Counter()
    category_correct = Counter()

    for case in cases:
        try:
            got = agent_fn(case.input)
            ok = case.expected.lower() in got.lower()
        except Exception as e:
            got = f"ERROR: {e}"
            ok = False

        correct += ok

        if ok:

            "ok": bool(ok),
            "category": case.category,

        "correct": correct,
        "accuracy": correct / len(cases),
        "by_category": {
            c: {
                "count": by_category[c],
                "correct": category_correct[c],
                "accuracy": category_correct[c] / by_category[c],
            } for c in by_category
        },
        "results": results,
    }

    print("=== running eval ===")
    report = run_eval(simple_agent, CASES)

    print(f"\nAccuracy: {report['accuracy']:.1%} ({report['correct']}/{report['total']})")

    for r in report["results"]:

    def __init__(self):
        self.requests = 0
        self.errors = 0
        self.total_cost = 0.0
        self.total_latency = 0.0
        self.feedback = []

    def track_request(self, latency: float, cost: float, error: bool = False):
        self.requests += 1
        self.total_latency += latency
        self.total_cost += cost
        if error:
            self.errors += 1

    def track_feedback(self, positive: bool):
        self.feedback.append(positive)

    def summary(self):
        n = self.requests or 1
        return {
            "requests": self.requests,
            "error_rate": self.errors / n,
            "avg_latency": self.total_latency / n,
            "total_cost": round(self.total_cost, 4),
            "positive_rate": sum(self.feedback) / len(self.feedback) if self.feedback else None,
        }</code></pre>

<h3>Теория</h3>
<p>LangGraph — библиотека для построения stateful-агентов как графов. В отличие от простого цикла tool calling, она даёт: персистентность, human-in-the-loop, ветвления, retry, стриминг шагов, мультиагентность.</p>

<h4>Что такое граф</h4>
<p>Граф — набор узлов (nodes) и рёбер (edges). Состояние (state) — общий словарь, который узлы читают и обновляют. Условные рёбра (conditional edges) — маршрутизация по состоянию.</p>

<table>
  <thead><tr><th>Понятие</th><th>Что это</th></tr></thead>
  <tbody>
    <tr><td>State</td><td>TypedDict или Pydantic-модель с полями</td></tr>
    <tr><td>Node</td><td>Функция, принимает state, возвращает обновление</td></tr>
    <tr><td>Edge</td><td>Переход между узлами</td></tr>
    <tr><td>Conditional edge</td><td>Роутер на основе state</td></tr>
    <tr><td>START / END</td><td>Встроенные маркеры начала и конца</td></tr>
    <tr><td>Checkpointer</td><td>Сохранение state по thread_id</td></tr>
  </tbody>
</table>

<h4>Чем лучше простого цикла</h4>
<ul>
  <li><b>Персистентность:</b> состояние сохраняется, граф возобновляется с любой точки</li>
  <li><b>HITL:</b> остановка для одобрения человеком через <code>interrupt</code></li>
  <li><b>Ветвление:</b> сложные условия перехода, не только «есть tool_calls или нет»</li>
  <li><b>Мультиагентность:</b> несколько агентов в одном графе</li>
  <li><b>Стриминг:</b> наблюдение за каждым шагом в реальном времени</li>
  <li><b>Retry на узле:</b> встроенный механизм повторных попыток</li>
</ul>

<h4>Когда НЕ нужен LangGraph</h4>
<ul>
  <li>Простой чат без инструментов — хватит прямого вызова API</li>
  <li>Один вызов LLM — не нужен граф</li>
  <li>Линейная цепочка из 2-3 шагов — можно функцией</li>
</ul>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Понять state</h4><p>Что агент помнит между шагами. Обычно: messages, счётчики, флаги.</p></div>
<div class="step" data-step="2"><h4>Определить узлы</h4><p>LLM, инструменты, обработка, финализация. Каждый — функция.</p></div>
<div class="step" data-step="3"><h4>Связать рёбрами</h4><p>Прямые переходы + условные для ветвлений.</p></div>
<div class="step" data-step="4"><h4>Скомпилировать</h4><p>graph = builder.compile(). Готов к invoke.</p></div>
<div class="step" data-step="5"><h4>Добавить checkpointer</h4><p>Для памяти и HITL. MemorySaver в тестах, Postgres в проде.</p></div>

<h3>Где это в Agentic</h3>
<p><b>Минимальный агент на LangGraph</b> (в следующем курсе — код):</p>
<pre><button class="copy-btn">copy</button><code>State → LLM → tool_calls? → tools → LLM → ... → END</code></pre>

<p><b>Агент-аналитик:</b></p>
<pre><button class="copy-btn">copy</button><code>START → retrieve → search → extract → verify → write → END
                    ↑                    |
                    └───── retry ────────┘</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Используют LangGraph для простых задач</b> — оверкилл. Начни с прямого API.</li>
  <li><b>Кладут всё в один узел</b> — теряют модульность и стриминг.</li>
  <li><b>Забывают про checkpointer</b> — нет памяти, нет HITL.</li>
  <li><b>Не ставят лимит шагов</b> — граф зацикливается.</li>
  <li><b>Путают add_edge и add_conditional_edges</b> — первый прямой, второй через роутер.</li>
</ul>
</div>

<script type="text/template" id="tpl-lg-2">
<h3>Теория</h3>
<p>Минимальный граф — один узел. Это база: понять структуру и запустить. Дальше наращиваем.</p>

<h4>Компоненты минимального графа</h4>
<ol>
  <li><b>State</b> — TypedDict с полем messages</li>
  <li><b>Node</b> — функция chatbot, вызывает LLM</li>
  <li><b>Edges</b> — START → chatbot → END</li>
  <li><b>Compile</b> — превращает builder в graph</li>
  <li><b>Invoke</b> — запуск с начальным state</li>
</ol>

<h4>add_messages — ключевой редьюсер</h4>
<p><code>Annotated[list, add_messages]</code> говорит LangGraph: новые сообщения <b>добавляются к списку</b>, а не перезаписывают его. Без редьюсера каждое обновление затирало бы историю.</p>

<h4>START и END</h4>
<p>Встроенные маркеры. <code>START</code> — точка входа, <code>END</code> — завершение графа. Обычные имена узлов не могут с ними пересекаться.</p>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Определить State</h4><p>TypedDict с полями. Для сообщений — Annotated[list, add_messages].</p></div>
<div class="step" data-step="2"><h4>Создать StateGraph</h4><p>builder = StateGraph(State).</p></div>
<div class="step" data-step="3"><h4>Добавить узлы</h4><p>builder.add_node("name", fn). Функция принимает state, возвращает обновление.</p></div>
<div class="step" data-step="4"><h4>Соединить</h4><p>add_edge — прямой переход. START и END встроенные.</p></div>
<div class="step" data-step="5"><h4>Скомпилировать</h4><p>graph = builder.compile(). Дальше — graph.invoke(input).</p></div>

<pre><button class="copy-btn">copy</button><code>from typing import TypedDict, Annotated
from langgraph.graph import StateGraph, START, END
from langgraph.graph.message import add_messages
from langchain_openai import ChatOpenAI

class State(TypedDict):
    messages: Annotated[list, add_messages]

llm = ChatOpenAI(model="gpt-4o-mini")

def chatbot(state: State):
    return {"messages": [llm.invoke(state["messages"])]}

builder = StateGraph(State)
builder.add_node("chatbot", chatbot)
builder.add_edge(START, "chatbot")
builder.add_edge("chatbot", END)

graph = builder.compile()
out = graph.invoke({"messages": [{"role": "user", "content": "Привет!"}]})
print(out["messages"][-1].content)</code></pre>

<div class="tip"><b>add_messages</b> — редьюсер: новые сообщения добавляются к списку, а не перезаписывают его. Без него история терялась бы.</div>

<h3>Где это в Agentic</h3>
<p><b>Чат-бот без инструментов.</b> Уже даёт преимущества: персистентность (с checkpointer), стриминг, HITL.</p>

<p><b>База для сложных графов.</b> Каждый следующий курс — надстройка над этим:</p>
<pre><button class="copy-btn">copy</button><code>Курс 2: State → chatbot → END
Курс 3: + условные переходы
Курс 4: + ToolNode
Курс 5: + checkpointer
Курс 6: + interrupt (HITL)
Курс 7: + супервизор
Курс 8: + стриминг
Курс 9: + subgraphs
Курс 10: + продакшн (retry, cache)</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Забывают Annotated с add_messages</b> — история перезаписывается.</li>
  <li><b>Используют обычный list</b> вместо add_messages — теряют предыдущие сообщения.</li>
  <li><b>Не указывают START</b> — граф не знает, откуда начинать.</li>
  <li><b>Забывают END</b> — граф не завершается, ошибка компиляции.</li>
  <li><b>Передают dict вместо message</b> в invoke — зависит от версии, лучше явный dict с role и content.</li>
</ul>
</div>

<script type="text/template" id="tpl-lg-3">
<h3>Теория</h3>
<p>Условные рёбра — маршрутизация. Роутер — функция, которая смотрит на state и возвращает <b>имя следующего узла</b>. Так делают цикл «модель ↔ инструменты» и любые ветвления.</p>

<h4>tools_condition — встроенный роутер</h4>
<p>LangGraph даёт готовый роутер для самого частого случая: если у модели есть tool_calls — идти в узел «tools», иначе в END.</p>

<pre><button class="copy-btn">copy</button><code>from langgraph.prebuilt import tools_condition

builder.add_conditional_edges("assistant", tools_condition)
# Эквивалент:
def tools_condition(state):
    last = state["messages"][-1]
    if getattr(last, "tool_calls", None):
        return "tools"
    return END</code></pre>

<h4>Свой роутер</h4>
<p>Для своих условий — пиши функцию. Возвращает строку (имя узла) или END.</p>

<pre><button class="copy-btn">copy</button><code>def route(state) -> str:
    last = state["messages"][-1]
    if getattr(last, "tool_calls", None):
        return "tools"
    if "error" in str(last.content).lower():
        return "retry"
    return END

builder.add_conditional_edges(
    "assistant",
    route,
    {"tools": "tools", "retry": "assistant", END: END},
)</code></pre>

<h4>Третий аргумент — mapping</h4>
<p>Словарь «что вернул роутер → куда идти». Если имена совпадают, можно опустить, но лучше писать явно — понятнее.</p>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Понять условие</h4><p>Что должно определять переход. Наличие tool_calls, флаг, значение счётчика.</p></div>
<div class="step" data-step="2"><h4>Написать роутер</h4><p>Функция принимает state, возвращает имя следующего узла.</p></div>
<div class="step" data-step="3"><h4>Добавить узел-назначение</h4><p>Куда идём при срабатывании условия. Например, узел «tools».</p></div>
<div class="step" data-step="4"><h4>Связать</h4><p>add_conditional_edges(from_node, router, mapping).</p></div>
<div class="step" data-step="5"><h4>Не забыть лимит</h4><p>Счётчик шагов в state + условие выхода в END. Иначе цикл.</p></div>

<pre><button class="copy-btn">copy</button><code>from typing import TypedDict, Annotated
from langgraph.graph import StateGraph, START, END
from langgraph.graph.message import add_messages
from langchain_openai import ChatOpenAI

class State(TypedDict):
    messages: Annotated[list, add_messages]
    steps: int

llm = ChatOpenAI(model="gpt-4o-mini")

def assistant(state: State):
    response = llm.invoke(state["messages"])
    return {"messages": [response], "steps": state.get("steps", 0) + 1}

def route(state: State) -> str:
    # Лимит шагов
    if state.get("steps", 0) >= 5:
        return END

    last = state["messages"][-1]
    if getattr(last, "tool_calls", None):
        return "tools"
    return END

def tools_node(state: State):
    # Здесь исполняются инструменты
    last = state["messages"][-1]
    results = []
    for call in last.tool_calls:
        results.append({
            "role": "tool",
            "tool_call_id": call["id"],
            "content": "result from tool",
        })
    return {"messages": results}

builder = StateGraph(State)
builder.add_node("assistant", assistant)
builder.add_node("tools", tools_node)
builder.add_edge(START, "assistant")
builder.add_conditional_edges("assistant", route, {"tools": "tools", END: END})
builder.add_edge("tools", "assistant")

graph = builder.compile()
out = graph.invoke({"messages": [{"role": "user", "content": "Привет"}], "steps": 0})
print(out["messages"][-1].content)</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Стандартный цикл агента.</b> Условное ребро «assistant → tools или END» — это и есть знаменитый «agent loop».</p>

<p><b>Retry при ошибке.</b> Если узел вернул ошибку — не END, а назад в assistant:</p>
<pre><button class="copy-btn">copy</button><code>def route(state):
    last = state["messages"][-1]
    if getattr(last, "tool_calls", None):
        return "tools"
    if "ошибка" in str(last.content).lower():
        return "retry"
    return END

builder.add_conditional_edges("assistant", route, {
    "tools": "tools",
    "retry": "assistant",
    END: END,
})</code></pre>

<p><b>Ветвление по типу задачи.</b> Разные роуты для поиска, вычислений, болтовни:</p>
<pre><button class="copy-btn">copy</button><code>def router(state):
    query = state["messages"][-1].content.lower()
    if "посчитай" in query or "сколько" in query:
        return "calculator"
    if "найди" in query or "новости" in query:
        return "search"
    return "chat"</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Забывают mapping</b> — роутер вернул имя, но граф не знает, куда идти.</li>
  <li><b>Возвращают не строку, а объект</b> — роутер должен вернуть имя узла.</li>
  <li><b>Нет лимита</b> — бесконечный цикл assistant → tools → assistant.</li>
  <li><b>Забывают про END</b> — граф не завершается.</li>
  <li><b>Путают возвращаемое значение роутера с именем узла</b> — должно совпадать точно.</li>
</ul>
</div>

<script type="text/template" id="tpl-lg-4">
<h3>Теория</h3>
<p>ToolNode — готовый узел LangGraph, который автоматически: получает tool_calls из последнего сообщения, вызывает функции, добавляет результаты в state с role=tool и правильным tool_call_id. Тебе не нужно писать этот цикл.</p>

<h4>Что делает ToolNode</h4>
<ol>
  <li>Берёт <code>tool_calls</code> из последнего assistant-сообщения</li>
  <li>Для каждого вызова находит функцию в переданном списке</li>
  <li>Валидирует аргументы (через Pydantic)</li>
  <li>Вызывает функцию</li>
  <li>Оборачивает результат в tool-сообщение</li>
  <li>Возвращает обновление state</li>
</ol>

<h4>bind_tools — привязка к модели</h4>
<pre><button class="copy-btn">copy</button><code>tools = [multiply, add]
llm = ChatOpenAI(model="gpt-4o-mini").bind_tools(tools)</code></pre>
<p>После bind_tools модель знает про инструменты и может возвращать tool_calls.</p>

<h4>Схема агента с инструментами</h4>
<pre><button class="copy-btn">copy</button><code>START → assistant → tools_condition
              ↑              ↓
              └─── tools ────┘
                             ↓ (если нет tool_calls)
                            END</code></pre>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Определить @tool функции</h4><p>Декоратор @tool читает сигнатуру и docstring, генерирует схему.</p></div>
<div class="step" data-step="2"><h4>bind_tools к LLM</h4><p>Модель узнаёт про доступные инструменты.</p></div>
<div class="step" data-step="3"><h4>Добавить узел assistant</h4><p>Вызывает LLM с messages, возвращает ответ.</p></div>
<div class="step" data-step="4"><h4>Добавить ToolNode</h4><p>Готовый узел для исполнения tool_calls.</p></div>
<div class="step" data-step="5"><h4>Связать tools_condition</h4><p>Если есть tool_calls — в tools, иначе END.</p></div>

<pre><button class="copy-btn">copy</button><code>from typing import TypedDict, Annotated
from langgraph.graph import StateGraph, START, END
from langgraph.graph.message import add_messages
from langgraph.prebuilt import ToolNode, tools_condition
from langchain_core.tools import tool
from langchain_openai import ChatOpenAI

@tool
def multiply(a: int, b: int) -> int:
    """Умножить два числа."""
    return a * b

@tool
def add(a: int, b: int) -> int:
    """Сложить два числа."""
    return a + b

tools = [multiply, add]
llm = ChatOpenAI(model="gpt-4o-mini").bind_tools(tools)

class State(TypedDict):
    messages: Annotated[list, add_messages]

def assistant(state: State):
    return {"messages": [llm.invoke(state["messages"])]}

builder = StateGraph(State)
builder.add_node("assistant", assistant)
builder.add_node("tools", ToolNode(tools))
builder.add_edge(START, "assistant")
builder.add_conditional_edges("assistant", tools_condition)
builder.add_edge("tools", "assistant")

graph = builder.compile()
out = graph.invoke({"messages": [{"role": "user", "content": "Сколько (12*7)+5?"}]})
print(out["messages"][-1].content)</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Продакшн-агент.</b> Это та самая архитектура «минимального агента», но в 20 строк кода — вместо 80 при ручном цикле.</p>

<p><b>Несколько инструментов.</b> ToolNode принимает список любого размера. Модель сама решает, какой вызвать.</p>

<p><b>Async-инструменты.</b> ToolNode умеет работать с async-функциями. Просто добавь async def при определении.</p>

<p><b>Обработка ошибок внутри инструмента.</b> Если @tool-функция падает — ToolNode поймает и вернёт ошибку как tool-результат. Модель увидит и адаптируется.</p>

<pre><button class="copy-btn">copy</button><code>@tool
def risky(x: int) -> dict:
    """Может упасть."""
    if x < 0:
        return {"error": "x must be positive"}
    return {"result": x * 2}</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Забывают bind_tools</b> — модель не знает про инструменты, не вызывает их.</li>
  <li><b>Не добавляют узел tools в граф</b> — tool_calls не исполняются.</li>
  <li><b>Забывают tools_condition</b> — граф всегда идёт в END или всегда в tools.</li>
  <li><b>Не связывают tools → assistant</b> — после инструмента не возвращаются к модели.</li>
  <li><b>Используют обычный @tool без docstring</b> — модель не понимает, когда вызывать.</li>
  <li><b>Нет лимита шагов</b> — модель может зациклиться на одном инструменте.</li>
</ul>
</div>

<script type="text/template" id="tpl-lg-5">
<h3>Теория</h3>
<p>Checkpointer сохраняет state после каждого узла. По <code>thread_id</code> можно возобновить граф с того же места. Это основа для памяти, HITL, продакшн-надёжности.</p>

<h4>Зачем нужен checkpointer</h4>
<ul>
  <li><b>Память между запросами:</b> диалог сохраняется, следующий вызов продолжает с той же историей</li>
  <li><b>HITL:</b> граф останавливается на interrupt, ждёт ответа человека, потом продолжает</li>
  <li><b>Мультипользовательность:</b> у каждого thread_id своя история</li>
  <li><b>Отладка:</b> можно посмотреть состояние в любой точке</li>
  <li><b>Возобновление после падения:</b> если процесс упал, граф продолжается с последнего чекпоинта</li>
</ul>

<h4>Виды checkpointer</h4>
<table>
  <thead><tr><th>Класс</th><th>Где хранит</th><th>Когда</th></tr></thead>
  <tbody>
    <tr><td>MemorySaver</td><td>В памяти</td><td>Тесты, прототипы</td></tr>
    <tr><td>SqliteSaver</td><td>SQLite-файл</td><td>Локальная разработка</td></tr>
    <tr><td>PostgresSaver</td><td>PostgreSQL</td><td>Продакшн</td></tr>
    <tr><td>AsyncSqliteSaver</td><td>SQLite async</td><td>FastAPI + локально</td></tr>
  </tbody>
</table>

<h4>thread_id — ключ к памяти</h4>
<p>Каждый thread_id — отдельный диалог. Один пользователь — один thread_id. Возвращаешься с тем же id — история восстанавливается.</p>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Создать checkpointer</h4><p>memory = MemorySaver().</p></div>
<div class="step" data-step="2"><h4>Скомпилировать с ним</h4><p>graph = builder.compile(checkpointer=memory).</p></div>
<div class="step" data-step="3"><h4>Config с thread_id</h4><p>config = {"configurable": {"thread_id": "user-42"}}.</p></div>
<div class="step" data-step="4"><h4>Invoke с config</h4><p>graph.invoke(input, config). История восстанавливается автоматически.</p></div>
<div class="step" data-step="5"><h4>Postgres для прода</h4><p>pip install langgraph-checkpoint-postgres. Создать таблицу. Использовать PostgresSaver.</p></div>

<pre><button class="copy-btn">copy</button><code>from langgraph.checkpoint.memory import MemorySaver

memory = MemorySaver()
graph = builder.compile(checkpointer=memory)

config = {"configurable": {"thread_id": "user-42"}}

# Первый запрос
out1 = graph.invoke(
    {"messages": [{"role": "user", "content": "Меня зовут Алиса"}]},
    config,
)
print(out1["messages"][-1].content)

# Второй запрос — история восстановлена
out2 = graph.invoke(
    {"messages": [{"role": "user", "content": "Как меня зовут?"}]},
    config,
)
print(out2["messages"][-1].content)  # Алиса</code></pre>

<div class="tip"><b>Для продакшна:</b> <code>pip install langgraph-checkpoint-postgres</code>, создай таблицу, используй PostgresSaver. Состояние выживет рестарт сервера.</div>

<h3>Где это в Agentic</h3>
<p><b>Персональный ассистент.</b> Помнит, что было в предыдущих сессиях:</p>
<pre><button class="copy-btn">copy</button><code>def chat(user_id: str, message: str) -> str:
    config = {"configurable": {"thread_id": user_id}}
    out = graph.invoke(
        {"messages": [{"role": "user", "content": message}]},
        config,
    )
    return out["messages"][-1].content

# Каждый пользователь — свой thread_id
chat("alice", "Меня зовут Алиса")
chat("bob", "Меня зовут Боб")
chat("alice", "Как меня зовут?")  # Алиса
chat("bob", "Как меня зовут?")    # Боб</code></pre>

<p><b>Возобновление после сбоя.</b> Если процесс упал — граф продолжает с чекпоинта при следующем invoke с тем же thread_id.</p>

<p><b>Получение состояния.</b> Можно посмотреть текущий state по thread_id:</p>
<pre><button class="copy-btn">copy</button><code>state = graph.get_state(config)
print(state.values)         # текущий state
print(state.next)           # какой узел следующий
print(state.config)         # метаданные чекпоинта</code></pre>

<p><b>История чекпоинтов.</b> Все сохранённые версии:</p>
<pre><button class="copy-btn">copy</button><code>for state in graph.get_state_history(config):
    print(state.values["messages"][-1].content)</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Забывают thread_id</b> — история не сохраняется, каждый запрос как первый.</li>
  <li><b>Один thread_id на всех</b> — все пользователи видят чужую историю.</li>
  <li><b>MemorySaver в проде</b> — при рестарте всё теряется. Нужен Postgres.</li>

  <li><b>Хранят PII в state без шифрования</b> — утечка через БД.</li>
</ul>
</div>

<script type="text/template" id="tpl-lg-6">
<h3>Теория</h3>
<p>Human-in-the-loop (HITL) — граф останавливается, отдаёт вопрос человеку, ждёт ответа, продолжает. Критично для операций с последствиями: отправка письма, платёж, удаление, публикация.</p>

<h4>Как работает interrupt</h4>
<ol>
  <li>В узле вызываешь <code>interrupt(payload)</code></li>
  <li>Граф останавливается, сохраняет state через checkpointer</li>
  <li>Возвращает payload наружу</li>
  <li>Человек отвечает</li>
  <li>Возобновляешь граф через <code>Command(resume=answer)</code></li>
  <li>Граф продолжает с того же места, получает ответ</li>
</ol>

<h4>Обязательно с checkpointer</h4>
<p>Без checkpointer граф не сможет возобновиться — не помнит, где остановился. MemorySaver в тестах, PostgresSaver в проде.</p>

<h4>Типичные сценарии HITL</h4>
<table>
  <thead><tr><th>Сценарий</th><th>Что подтверждает человек</th></tr></thead>
  <tbody>
    <tr><td>Отправка email</td><td>Текст и получатель</td></tr>
    <tr><td>Платёж</td><td>Сумма и реквизиты</td></tr>
    <tr><td>Удаление данных</td><td>Что удалять</td></tr>
    <tr><td>Публикация</td><td>Контент поста</td></tr>
    <tr><td>Изменение конфига</td><td>Новые значения</td></tr>
  </tbody>
</table>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Определить узел с interrupt</h4><p>Узел, который должен остановиться и ждать.</p></div>
<div class="step" data-step="2"><h4>Вызвать interrupt</h4><p>decision = interrupt({"question": ..., "data": ...}).</p></div>
<div class="step" data-step="3"><h4>Compile с checkpointer</h4><p>Без него HITL не работает.</p></div>
<div class="step" data-step="4"><h4>Первый invoke</h4><p>Дойдёт до interrupt, вернёт payload наружу, остановится.</p></div>
<div class="step" data-step="5"><h4>Command(resume=...)</h4><p>Возобновляет с ответом человека.</p></div>

<pre><button class="copy-btn">copy</button><code>from typing import TypedDict, Annotated
from langgraph.graph import StateGraph, START, END
from langgraph.graph.message import add_messages
from langgraph.checkpoint.memory import MemorySaver
from langgraph.types import interrupt, Command

class State(TypedDict):
    messages: Annotated[list, add_messages]
    pending_action: str

def plan_action(state: State):
    """Планирует действие, но не выполняет."""
    return {"pending_action": "send_email_to_alice"}

def approve(state: State):
    """Останавливается и ждёт одобрения."""
    decision = interrupt({
        "question": "Одобрить действие?",
        "action": state["pending_action"],
    })
    return {"approved": decision["approved"]}

def execute(state: State):
    """Выполняет или отменяет."""
    if state.get("approved"):
        return {"messages": [{"role": "assistant", "content": "Выполнено"}]}
    return {"messages": [{"role": "assistant", "content": "Отменено"}]}

builder = StateGraph(State)
builder.add_node("plan", plan_action)
builder.add_node("approve", approve)
builder.add_node("execute", execute)
builder.add_edge(START, "plan")
builder.add_edge("plan", "approve")
builder.add_edge("approve", "execute")
builder.add_edge("execute", END)

memory = MemorySaver()
graph = builder.compile(checkpointer=memory)
config = {"configurable": {"thread_id": "user-1"}}

# Первый invoke — остановится на interrupt
out = graph.invoke({"messages": []}, config)
print(out)   # покажет вопрос пользователю

# Человек одобряет — возобновляем
result = graph.invoke(Command(resume={"approved": True}), config)
print(result["messages"][-1].content)   # "Выполнено"</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Узел HITL после планирования.</b> Классическая схема: агент формирует план, человек одобряет, агент исполняет.</p>

<pre><button class="copy-btn">copy</button><code>START → plan → approve (interrupt) → execute → END</code></pre>

<p><b>HITL на критичных инструментах.</b> Не весь граф останавливается, только перед опасным вызовом:</p>
<pre><button class="copy-btn">copy</button><code>def delete_node(state: State):
    decision = interrupt({
        "action": "delete",
        "what": state["record_id"],
    })
    if not decision["approved"]:
        return {"status": "cancelled"}
    db.delete(state["record_id"])
    return {"status": "deleted"}</code></pre>

<p><b>Мультиэтапное одобрение.</b> Несколько interrupt подряд — сначала менеджер, потом директор:</p>
<pre><button class="copy-btn">copy</button><code>def approve_manager(state):
    return {"manager_ok": interrupt({"role": "manager"})["approved"]}

def approve_director(state):
    if not state["manager_ok"]:
        return {"director_ok": False}
    return {"director_ok": interrupt({"role": "director"})["approved"]}</code></pre>

<p><b>HITL в веб-приложении.</b> Граф останавливается, UI показывает кнопки, пользователь кликает, возобновление:</p>
<pre><button class="copy-btn">copy</button><code># На сервере
@app.post("/agent/start")
def start(question: str):
    out = graph.invoke({"messages": [...]}, config)
    return out   # UI покажет вопрос

@app.post("/agent/resume")
def resume(answer: str):
    out = graph.invoke(Command(resume=answer), config)
    return out</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Забывают checkpointer</b> — HITL не работает, граф не возобновится.</li>
  <li><b>Interrupt вне узла</b> — должно быть внутри функции-узла.</li>
  <li><b>Не возвращают значение из узла после resume</b> — interrupt возвращает ответ, надо использовать.</li>
  <li><b>Не тот thread_id</b> — возобновление не находит состояние.</li>
  <li><b>Много interrupt подряд без плана</b> — пользователя забрасывают вопросами.</li>
</ul>
</div>

<script type="text/template" id="tpl-lg-7">
<h3>Теория</h3>
<p>Мультиагентность — несколько специализированных агентов в одном графе. Каждый решает свою задачу. Supervisor (или менеджер) координирует.</p>

<h4>Паттерны мультиагентности</h4>
<table>
  <thead><tr><th>Паттерн</th><th>Структура</th><th>Когда</th></tr></thead>
  <tbody>
    <tr><td>Supervisor</td><td>Один менеджер, N исполнителей</td><td>Разные специализации</td></tr>
    <tr><td>Hierarchical</td><td>Несколько уровней менеджеров</td><td>Большая система</td></tr>
    <tr><td>Sequential</td><td>A → B → C</td><td>Линейный пайплайн</td></tr>
    <tr><td>Network</td><td>Все со всеми</td><td>Сложная координация</td></tr>
    <tr><td>Debate</td><td>Два агента спорят</td><td>Улучшение качества</td></tr>
  </tbody>
</table>

<h4>Supervisor — самый частый</h4>
<p>Менеджер-агент решает, кто из специалистов работает. Каждый специалист возвращает результат менеджеру. Менеджер решает, кто следующий или закончить.</p>

<h4>langgraph-supervisor</h4>
<p>Готовая библиотека для supervisor-паттерна:</p>
<pre><button class="copy-btn">copy</button><code>from langgraph_supervisor import create_supervisor

workflow = create_supervisor(
    agents=[researcher, writer, reviewer],
    model=ChatOpenAI(model="gpt-4o"),
    prompt="Ты менеджер. Делегируй задачи специалистам.",
)
app = workflow.compile()</code></pre>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Определить специалистов</h4><p>Каждый — свой StateGraph или ReAct-агент с инструментами.</p></div>
<div class="step" data-step="2"><h4>Создать супервизора</h4><p>create_supervisor с agents, model, prompt.</p></div>
<div class="step" data-step="3"><h4>Compile</h4><p>workflow.compile() возвращает готовый app.</p></div>
<div class="step" data-step="4"><h4>Invoke</h4><p>Обычный invoke. Супервизор сам распределяет.</p></div>
<div class="step" data-step="5"><h4>Наблюдение</h4><p>Стриминг покажет, какой агент работает.</p></div>

<pre><button class="copy-btn">copy</button><code>from langchain_openai import ChatOpenAI
from langchain_core.tools import tool
from langgraph.prebuilt import create_react_agent
from langgraph_supervisor import create_supervisor

# Инструменты
@tool
def search_web(query: str) -> str:
    """Ищет в интернете."""
    return f"Результаты поиска по запросу: {query}"

@tool
def write_text(topic: str) -> str:
    """Пишет текст на тему."""
    return f"Готовый текст про {topic}"

@tool
def review_text(text: str) -> str:
    """Проверяет текст."""
    return f"Отзыв: {text[:50]}... — хорошо"

# Агенты-специалисты
researcher = create_react_agent(
    model="gpt-4o-mini",
    tools=[search_web],
    name="researcher",
    prompt="Ты исследователь. Ищи информацию.",
)

writer = create_react_agent(
    model="gpt-4o-mini",
    tools=[write_text],
    name="writer",
    prompt="Ты писатель. Пиши тексты.",
)

reviewer = create_react_agent(
    model="gpt-4o-mini",
    tools=[review_text],
    name="reviewer",
    prompt="Ты редактор. Проверяй тексты.",
)

# Супервизор
workflow = create_supervisor(
    agents=[researcher, writer, reviewer],
    model=ChatOpenAI(model="gpt-4o"),
    prompt="Ты менеджер. Делегируй задачи специалистам, пока не решено.",
)
app = workflow.compile()

result = app.invoke({
    "messages": [{"role": "user", "content": "Напиши статью про Python async"}],
})
print(result["messages"][-1].content)</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Агент-аналитик.</b> Researcher → writer → reviewer:</p>
<pre><button class="copy-btn">copy</button><code>START → supervisor → {researcher | writer | reviewer} → supervisor → ... → END</code></pre>

<p><b>Customer support.</b> Триагентная система: классификатор → решатель → эскалатор:</p>
<pre><button class="copy-btn">copy</button><code>START → classifier → (solver | escalator) → END</code></pre>

<p><b>Code review.</b> Один агент пишет код, другой проверяет, третий исправляет:</p>
<pre><button class="copy-btn">copy</button><code>developer → reviewer → (fix → developer | END)</code></pre>

<p><b>Research pipeline.</b> Пять агентов: один ищет, один извлекает, один проверяет, один синтезирует, один пишет:</p>
<pre><button class="copy-btn">copy</button><code>supervisor → search → extract → verify → synthesize → write → END</code></pre>

<p><b>Debate для качества.</b> Два агента — pro и contra — обсуждают вопрос, третий судит:</p>
<pre><button class="copy-btn">copy</button><code>START → pro → contra → pro → contra → judge → END</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Слишком много агентов</b> — сложно отлаживать. Начни с 2-3.</li>
  <li><b>Нет чётких ролей</b> — агенты дублируют друг друга.</li>
  <li><b>Бесконечный supervisor-цикл</b> — менеджер зовёт специалистов без конца. Нужен лимит.</li>
  <li><b>Нет общего контекста</b> — агенты не видят, что делали другие.</li>
  <li><b>Дорого</b> — каждый агент — отдельный вызов LLM. Считай бюджет.</li>
</ul>
</div>

<script type="text/template" id="tpl-lg-8">
<h3>Теория</h3>
<p>LangGraph умеет стримить три вещи: значения state, обновления узлов, токены LLM. Это критично для UX — пользователь видит, что агент работает, а не ждёт 30 секунд пустого экрана.</p>

<h4>Четыре режима стриминга</h4>
<table>
  <thead><tr><th>Режим</th><th>Что даёт</th><th>Когда</th></tr></thead>
  <tbody>
    <tr><td><code>values</code></td><td>Полный state после каждого шага</td><td>Отладка, наблюдение</td></tr>
    <tr><td><code>updates</code></td><td>Только изменения от узлов</td><td>UI прогресс</td></tr>
    <tr><td><code>messages</code></td><td>Токены LLM + метаданные</td><td>Чат-интерфейс</td></tr>
    <tr><td><code>custom</code></td><td>Свои события через get_stream_writer</td><td>Кастомные метрики</td></tr>
  </tbody>
</table>

<h4>stream и astream</h4>
<p><code>graph.stream(input, stream_mode=...)</code> — синхронный. <code>graph.astream(...)</code> — асинхронный. Оба возвращают генераторы.</p>

<h4>Несколько режимов сразу</h4>
<p>Можно передать список: <code>stream_mode=["updates", "messages"]</code>. Каждое событие будет кортежем (mode, chunk).</p>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Простой stream</h4><p>graph.stream(input, stream_mode="updates") — обновления по узлам.</p></div>
<div class="step" data-step="2"><h4>Токены LLM</h4><p>stream_mode="messages" — каждый chunk содержит токен и метаданные.</p></div>
<div class="step" data-step="3"><h4>Список режимов</h4><p>stream_mode=["updates", "messages"] — оба.</p></div>
<div class="step" data-step="4"><h4>Async</h4><p>graph.astream(...) с async for — для FastAPI и веб-приложений.</p></div>
<div class="step" data-step="5"><h4>SSE в UI</h4><p>Передавай chunks в StreamingResponse (FastAPI) — пользователь видит живой вывод.</p></div>

<pre><button class="copy-btn">copy</button><code># Обновления по узлам
for chunk in graph.stream(input, stream_mode="updates"):
    print(chunk)
# {"assistant": {"messages": [...]}}
# {"tools": {"messages": [...]}}
# {"assistant": {"messages": [...]}}

# Токены LLM
for msg, meta in graph.stream(input, stream_mode="messages"):
    print(msg.content, end="", flush=True)
# При, вет, ...

# Список режимов
for mode, chunk in graph.stream(input, stream_mode=["updates", "messages"]):
    if mode == "updates":
        print(f"\n[node] {chunk}")
    elif mode == "messages":
        msg, meta = chunk
        print(msg.content, end="")

# Async
async for chunk in graph.astream(input, stream_mode="updates"):
    print(chunk)</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Чат-интерфейс с живым ответом.</b> Пользователь видит, как модель печатает:</p>
<pre><button class="copy-btn">copy</button><code>def stream_chat(graph, message: str):
    for msg, meta in graph.stream(
        {"messages": [{"role": "user", "content": message}]},
        stream_mode="messages",
    ):
        if msg.content:
            print(msg.content, end="", flush=True)</code></pre>

<p><b>SSE в FastAPI.</b> Стриминг графа в браузер:</p>
<pre><button class="copy-btn">copy</button><code>from fastapi import FastAPI
from fastapi.responses import StreamingResponse
import json

app = FastAPI()

@app.get("/agent/stream")
async def agent_stream(q: str):
    async def events():
        async for chunk in graph.astream(
            {"messages": [{"role": "user", "content": q}]},
            stream_mode="updates",
        ):
            yield f"data: {json.dumps(chunk, default=str)}\n\n"
        yield "data: [DONE]\n\n"

    return StreamingResponse(events(), media_type="text/event-stream")</code></pre>

<p><b>Отображение шагов агента.</b> Пользователь видит: «думаю», «вызываю search», «анализирую результат»:</p>
<pre><button class="copy-btn">copy</button><code>for chunk in graph.stream(input, stream_mode="updates"):
    for node_name, update in chunk.items():
        if node_name == "assistant":
            print("🤔 Думаю...")
        elif node_name == "tools":
            print("🔧 Вызываю инструмент")
        else:
            print(f"⚙️ {node_name}")</code></pre>

<p><b>Отладка через values.</b> Полное состояние после каждого шага — видно, что меняется:</p>
<pre><button class="copy-btn">copy</button><code>for state in graph.stream(input, stream_mode="values"):
    print(f"messages: {len(state['messages'])}")</code></pre>

<p><b>Кастомные события.</b> Если нужно отправить метрики, прогресс, промежуточные данные:</p>
<pre><button class="copy-btn">copy</button><code>from langgraph.config import get_stream_writer

def my_node(state):
    writer = get_stream_writer()
    writer({"status": "starting", "progress": 0})

    for i in range(10):
        writer({"status": "processing", "progress": i * 10})

    return {"messages": [...]}

# Чтение
for chunk in graph.stream(input, stream_mode="custom"):
    print(chunk)</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Путают stream_mode</b> — values vs updates. values даёт весь state, updates только изменения.</li>
  <li><b>Синхронный stream в async-коде</b> — блокирует loop. Используй astream.</li>
  <li><b>Не делают flush</b> — текст копится в буфере. print с flush=True.</li>
  <li><b>messages без проверки content</b> — chunk может быть None. Проверяй.</li>
  <li><b>Забывают [DONE] в SSE</b> — клиент не знает, что поток закончился.</li>
</ul>
</div>

<script type="text/template" id="tpl-lg-9">
<h3>Теория</h3>
<p>Subgraph — граф внутри графа. Каждый подграф — отдельный StateGraph, который компилируется и используется как узел в родительском графе.</p>

<h4>Зачем нужны subgraphs</h4>
<ul>
  <li><b>Модульность:</b> один подграф — одна ответственность</li>
  <li><b>Переиспользование:</b> подграф поиска используется в разных агентах</li>
  <li><b>Изоляция:</b> у каждого подграфа свой state, свои узлы</li>
  <li><b>Отладка:</b> проще тестировать маленькие графы</li>
  <li><b>Командная работа:</b> разные люди делают разные подграфы</li>
</ul>

<h4>Два подхода к состоянию</h4>
<ol>
  <li><b>Общий state:</b> родитель и подграф используют один TypedDict. Проще, но меньше изоляции.</li>
  <li><b>Свой state:</b> у подграфа свой TypedDict, нужно преобразование при входе и выходе.</li>
</ol>

<h4>Как добавить subgraph</h4>
<pre><button class="copy-btn">copy</button><code>sub_builder = StateGraph(SubState)
# ... узлы и рёбра подграфа
sub_graph = sub_builder.compile()

main_builder = StateGraph(MainState)
main_builder.add_node("sub", sub_graph)   # subgraph как узел
# ... остальные узлы родителя</code></pre>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Определить подграф</h4><p>Свой StateGraph со своими узлами.</p></div>
<div class="step" data-step="2"><h4>Скомпилировать</h4><p>sub_graph = sub_builder.compile().</p></div>
<div class="step" data-step="3"><h4>Добавить в родитель</h4><p>main_builder.add_node("name", sub_graph).</p></div>
<div class="step" data-step="4"><h4>Связать рёбрами</h4><p>add_edge(START, "name"), add_edge("name", следующий).</p></div>
<div class="step" data-step="5"><h4>Проверить state</h4><p>Подграф получает state родителя на входе, возвращает обновление.</p></div>

<pre><button class="copy-btn">copy</button><code>from typing import TypedDict, Annotated
from langgraph.graph import StateGraph, START, END

# === ПОДГРАФ 1: поиск ===
class SearchState(TypedDict):
    query: str
    results: list

def build_query(state: SearchState):
    return {"query": f"optimized: {state['query']}"}

def fetch_results(state: SearchState):
    return {"results": [f"result for {state['query']}"]}

search_builder = StateGraph(SearchState)
search_builder.add_node("query", build_query)
search_builder.add_node("fetch", fetch_results)
search_builder.add_edge(START, "query")
search_builder.add_edge("query", "fetch")
search_builder.add_edge("fetch", END)
search_graph = search_builder.compile()

# === ПОДГРАФ 2: обработка ===
class ProcessState(TypedDict):
    data: list
    summary: str

def summarize(state: ProcessState):
    return {"summary": f"Summary of {len(state['data'])} items"}

process_builder = StateGraph(ProcessState)
process_builder.add_node("summarize", summarize)
process_builder.add_edge(START, "summarize")
process_builder.add_edge("summarize", END)
process_graph = process_builder.compile()

# === РОДИТЕЛЬСКИЙ ГРАФ ===
class MainState(TypedDict):
    query: str
    results: list
    summary: str

main_builder = StateGraph(MainState)
main_builder.add_node("search", search_graph)
main_builder.add_node("process", process_graph)

def split_for_search(state):
    return {"query": state["query"]}

def combine(state):
    return {"summary": state["summary"]}

main_builder.add_edge(START, "search")
main_builder.add_edge("search", "process")
main_builder.add_edge("process", END)

graph = main_builder.compile()
out = graph.invoke({"query": "python async"})
print(out)</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Агент-аналитик с двумя подграфами:</b></p>
<pre><button class="copy-btn">copy</button><code>Родитель:
  START → search_subgraph → analyze_subgraph → write_subgraph → END

search_subgraph: query → fetch → rerank → END
analyze_subgraph: extract → verify → END
write_subgraph: draft → review → finalize → END</code></pre>

<p><b>Переиспользование search_subgraph.</b> Один подграф поиска — в разных агентах:</p>
<pre><button class="copy-btn">copy</button><code>def create_research_agent():
    builder = StateGraph(State)
    builder.add_node("search", search_graph)   # переиспользуем
    # ...

def create_monitor_agent():
    builder = StateGraph(State)
    builder.add_node("search", search_graph)   # тот же
    # ...</code></pre>

<p><b>Team-based разработка.</b> Каждый подграф — отдельный модуль, отдельный автор, отдельные тесты:</p>
<pre><button class="copy-btn">copy</button><code>my_agent/
├── graphs/
│   ├── __init__.py
│   ├── search_graph.py       # подграф поиска
│   ├── analyze_graph.py      # подграф анализа
│   └── write_graph.py        # подграф генерации
├── main.py                    # родительский граф
└── tests/
    ├── test_search.py
    ├── test_analyze.py
    └── test_write.py</code></pre>

<p><b>Вложенные уровни.</b> Подграфы могут содержать свои подграфы. Получается иерархия как в микросервисах:</p>
<pre><button class="copy-btn">copy</button><code>main
├── research (subgraph)
│   ├── search (sub-subgraph)
│   └── extract (sub-subgraph)
└── write (subgraph)
    ├── draft (sub-subgraph)
    └── polish (sub-subgraph)</code></pre>

<h3>Типичные ошибки</h3>
<div class="pitfall">
<h4>Что делают новички</h4>
<ul>
  <li><b>Разные TypedDict без преобразования</b> — ключи не совпадают, подграф не получает данные.</li>
  <li><b>Забывают про общий state</b> — передают только что-то, а нужно больше.</li>
  <li><b>Слишком мелкие подграфы</b> — оверкилл, если узел один.</li>
  <li><b>Циклические зависимости</b> — граф A использует B, B использует A. ImportError.</li>
  <li><b>Не тестируют подграфы отдельно</b> — ошибки всплывают только в родителе.</li>
</ul>
</div>

<h3>Теория</h3>
<p>Продакшн-граф отличается от прототипа: retry на узлах, кэш LLM, лимиты, наблюдаемость, persistence. LangGraph даёт встроенные механизмы, но нужно правильно их настроить.</p>

<h4>Обязательный минимум</h4>
<table>
  <thead><tr><th>Что</th><th>Зачем</th></tr></thead>
  <tbody>
    <tr><td>Retry на узле</td><td>LLM API падает, инструменты таймаутят</td></tr>
    <tr><td>Лимит шагов</td><td>Защита от зацикливания</td></tr>
    <tr><td>Checkpointer на Postgres</td><td>Возобновление, память, HITL</td></tr>
    <tr><td>Кэш LLM</td><td>Экономия денег и времени</td></tr>
    <tr><td>Tracing</td><td>LangSmith или LangFuse</td></tr>
    <tr><td>Budget cap</td><td>Защита от $500 за ночь</td></tr>
  </tbody>
</table>

<h4>Retry policy на узле</h4>
<pre><button class="copy-btn">copy</button><code>builder.add_node(
    "llm_call",
    llm_call_fn,
    retry={"max_attempts": 3, "backoff_factor": 2.0},
)</code></pre>

<h4>Кэш LLM</h4>
<pre><button class="copy-btn">copy</button><code>from langchain_core.caches import InMemoryCache
from langchain_core.globals import set_llm_cache

set_llm_cache(InMemoryCache())
# Или Redis для продакшна</code></pre>

<h4>Лимит шагов через роутер</h4>
<pre><button class="copy-btn">copy</button><code>def limit_router(state):
    if state.get("steps", 0) &gt;= 15:
        return END
    return "continue"</code></pre>

<h4>LangGraph Platform</h4>
<p>Официальная платформа для деплоя. Даёт из коробки: persistence, HITL, стриминг, масштабирование. Дороже, чем свой деплой, но быстрее.</p>

<h3>Пошаговый разбор</h3>
<div class="step" data-step="1"><h4>Retry</h4><p>На каждый узел, который делает внешний вызов.</p></div>
<div class="step" data-step="2"><h4>Лимит шагов</h4><p>Счётчик в state, роутер проверяет перед переходом.</p></div>
<div class="step" data-step="3"><h4>Checkpointer</h4><p>PostgresSaver в проде. Создай таблицы.</p></div>
<div class="step" data-step="4"><h4>Кэш</h4><p>set_llm_cache с Redis или InMemory.</p></div>
<div class="step" data-step="5"><h4>Tracing</h4><p>LANGCHAIN_TRACING_V2=true + API key.</p></div>

<pre><button class="copy-btn">copy</button><code>from langgraph.graph import StateGraph, START, END
from langgraph.checkpoint.postgres import PostgresSaver
from langchain_core.caches import InMemoryCache
from langchain_core.globals import set_llm_cache

# === 1. RETRY ПОЛИТИКА ===
builder.add_node(
    "llm_call",
    llm_call_fn,
    retry={"max_attempts": 3},
)

# === 2. ЛИМИТ ШАГОВ ===
class State(TypedDict):
    messages: Annotated[list, add_messages]
    steps: int

def increment(state):
    return {"steps": state.get("steps", 0) + 1}

def limit_router(state):
    if state.get("steps", 0) &gt;= 15:
        return END
    return "continue"

builder.add_conditional_edges("increment", limit_router, {
    "continue": "next_node",
    END: END,
})

# === 3. POSTGRES CHECKPOINTER ===
with PostgresSaver.from_conn_string("postgresql://...") as checkpointer:
    checkpointer.setup()   # создаёт таблицы
    graph = builder.compile(checkpointer=checkpointer)

# === 4. КЭШ ===
set_llm_cache(InMemoryCache())
# Для прода: from langchain_redis import RedisCache

# === 5. TRACING (переменные окружения) ===
import os
os.environ["LANGCHAIN_TRACING_V2"] = "true"
os.environ["LANGCHAIN_API_KEY"] = "ls__..."
os.environ["LANGCHAIN_PROJECT"] = "my-agent-prod"</code></pre>

<h3>Где это в Agentic</h3>
<p><b>Полный продакшн-граф.</b> Все элементы вместе:</p>
<pre><button class="copy-btn">copy</button><code>from langgraph.graph import StateGraph, START, END
from langgraph.checkpoint.postgres import PostgresSaver
from langgraph.prebuilt import ToolNode, tools_condition
from langchain_openai import ChatOpenAI

# State
class State(TypedDict):
    messages: Annotated[list, add_messages]
    steps: int
    cost_usd: float

# Модель с tools
llm = ChatOpenAI(model="gpt-4o-mini", timeout=30).bind_tools(tools)

# Узлы
def assistant(state):
    response = llm.invoke(state["messages"])
    # Считаем стоимость
    cost = estimate_cost(response)
    return {
        "messages": [response],
        "steps": state.get("steps", 0) + 1,
        "cost_usd": state.get("cost_usd", 0) + cost,
    }

# Построение с retry
builder = StateGraph(State)
builder.add_node("assistant", assistant, retry={"max_attempts": 3})
builder.add_node("tools", ToolNode(tools), retry={"max_attempts": 2})

# Условное ребро с лимитом
def router(state):
    if state.get("steps", 0) &gt;= 15:
        return END
    if state.get("cost_usd", 0) &gt; 1.0:
        return END
    return tools_condition(state)

builder.add_edge(START, "assistant")
builder.add_conditional_edges("assistant", router)
builder.add_edge("tools", "assistant")

# Compile с Postgres
with PostgresSaver.from_conn_string(DB_URL) as cp:
    cp.setup()
    graph = builder.compile(checkpointer=cp)</code></pre>

<p><b>Разные окружения.</b> Dev — MemorySaver, prod — Postgres:</p>
<pre><button class="copy-btn">copy</button><code>import os

if os.getenv("ENV") == "production":
    from langgraph.checkpoint.postgres import PostgresSaver
    cp = PostgresSaver.from_conn_string(os.environ["DB_URL"])
else:
    from langgraph.checkpoint.memory import MemorySaver
    cp = MemorySaver()

graph = builder.compile(checkpointer=cp)</code></pre>

<p><b>Метрики и алерты.</b> Логируй каждый вызов, следи за стоимостью:</p>
<pre><button class="copy-btn">copy</button><code>from collections import defaultdict

class AgentMetrics:
    def __init__(self):
        self.calls = 0
        self.total_cost = 0.0
        self.total_tokens = 0
        self.errors = defaultdict(int)

    def track_llm(self, usage, model):
        self.calls += 1
        self.total_tokens += usage.prompt_tokens + usage.completion_tokens
        prices = {"gpt-4o-mini": (0.15, 0.60)}
        in_p, out_p = prices.get(model, (0, 0))
        self.total_cost += usage.prompt_tokens * in_p / 1000000
        self.total_cost += usage.completion_tokens * out_p / 1000000

    def track_error(self, error_type):
        self.errors[error_type] += 1

    def summary(self):
        return {
            "calls": self.calls,
            "tokens": self.total_tokens,
            "cost_usd": round(self.total_cost, 4),
            "errors": dict(self.errors),
        }</code></pre>

<div class="pitfall">
<h4>Что делают новички</h4>

  <li><b>Нет retry</b> — один сбой API роняет сессию.</li>
  <li><b>Нет лимита шагов</b> — агент зацикливается, деньги сгорают.</li>
  <li><b>Нет budget cap</b> — узнают о $500 только из счёта.</li>
  <li><b>Не включают tracing</b> — не понимают, где тормозит.</li>
  <li><b>Retry без backoff</b> — долбят упавший сервис.</li>
  <li><b>Кэш без TTL</b> — старые ответы возвращаются вместо свежих.</li>
  <li><b>Нет мониторинга</b> — узнают о проблемах от пользователей.</li>
